<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9F6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>SIS-Assist · Pflegeprozess</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light dark;
  --paper:#FAF9F6; --paper2:#FFFFFF; --paper3:#F3EFE8;
  --ink:#211B18; --ink-soft:#6B6259; --ink-faint:#A89E93;
  --line:#E7E1D8; --line-strong:#D8D0C4;
  --accent:#8B1A4A; --accent-ink:#FFFFFF; --accent-50:#FDF2F7; --accent-100:#FCE7F0;
  --gold:#C5982A; --gold-dark:#A67D1A; --gold-50:#FBF8EE;
  --ok:#2C5F4A; --ok-wash:#E9F1EC;
  --warn:#A67D1A; --warn-wash:#FBF8EE;
  --crit:#B0392E; --crit-wash:#FAECEA;
  --shadow:0 1px 2px rgba(33,27,24,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#181411; --paper2:#211B18; --paper3:#282019;
    --ink:#F0EBE4; --ink-soft:#B5AB9F; --ink-faint:#7E756A;
    --line:#352D26; --line-strong:#453B32;
    --accent:#D4719A; --accent-ink:#241016; --accent-50:#2C1A22; --accent-100:#3A2230;
    --gold:#D9B04C; --gold-dark:#D9B04C; --gold-50:#2C2517;
    --ok:#7BB89A; --ok-wash:#1C2A23;
    --warn:#D9B04C; --warn-wash:#2C2517;
    --crit:#E08072; --crit-wash:#33201C;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
body{background:var(--paper); color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;}
.wrap{max-width:980px; margin:0 auto;
  padding-inline:max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
  padding-block:0 calc(56px + env(safe-area-inset-bottom, 0px));}
button,select,input,textarea{font:inherit; color:inherit;}
button{touch-action:manipulation; -webkit-tap-highlight-color:transparent; cursor:pointer;}
h1,h2,h3,.serif{font-family:'Newsreader',Georgia,serif; font-weight:500; letter-spacing:-.01em; text-wrap:balance;}
h1{font-size:clamp(24px,4.5vw,34px); line-height:1.12; margin:2px 0 4px;}
h1 em{font-style:italic; color:var(--accent);}
h2{font-size:22px; margin:0 0 4px;}
h3{font-size:17px; margin:0;}
p{margin:0 0 12px; max-width:72ch;}
.eyebrow{font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);}
.muted{color:var(--ink-soft)} .faint{color:var(--ink-faint); font-size:13px;}
.num{font-variant-numeric:tabular-nums}
.hdr{padding-block:20px 12px; border-bottom:1px solid var(--line-strong);}
.hdr-top{display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap;}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.spread{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap;}

/* Bewohner-Leiste */
.bw-bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 0;}
.bw-bar select{background:var(--paper2); border:1px solid var(--line-strong); border-radius:6px; padding:8px 10px; min-width:180px; max-width:60vw;}

/* Buttons */
.btn{appearance:none; border:1px solid var(--line-strong); background:var(--paper2); border-radius:6px;
  padding:8px 14px; font-size:14px; font-weight:500; color:var(--ink);}
.btn:hover{border-color:var(--ink-faint)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
.btn.small{padding:5px 10px; font-size:13px;}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-soft);}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--crit); border-color:var(--crit);}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* Tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:22px; overflow-x:auto; scrollbar-width:none;
  position:sticky; top:0; z-index:20; background:var(--paper); padding-top:env(safe-area-inset-top, 0px);}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none; background:none; border:none; border-bottom:2px solid transparent; margin-bottom:-1px;
  padding:12px 12px 10px; font-size:14px; font-weight:500; color:var(--ink-soft); white-space:nowrap;}
.tab[aria-selected="true"]{color:var(--accent); border-bottom-color:var(--accent); font-weight:600;}
.tab .cnt{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; margin-left:4px;}
.tab .dot-alert{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--crit); margin-left:5px; vertical-align:1px;}

/* Cards & Layout */
.card{background:var(--paper2); border:1px solid var(--line); border-radius:6px; box-shadow:var(--shadow); padding:16px 18px; margin-bottom:14px;}
.card.tight{padding:12px 14px}
.grid{display:grid; gap:14px;}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
.section-head{margin:26px 0 12px;}
.section-head:first-child{margin-top:0}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0; border:1px solid var(--line); border-radius:6px; background:var(--paper2); overflow:hidden; margin-bottom:18px;}
.kpi{padding:14px 16px 12px; border-left:1px solid var(--line);}
.kpi:first-child{border-left:none}
.kpi .v{font-family:'Newsreader',Georgia,serif; font-size:34px; line-height:1.05; font-variant-numeric:tabular-nums;}
.kpi .v .dot{color:var(--gold);}
.kpi .l{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px;}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)} .kpi{border-top:1px solid var(--line)} .kpi:nth-child(-n+2){border-top:none} .kpi:nth-child(odd){border-left:none}}

/* Chips & Pills */
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:3px 10px; border-radius:99px; white-space:nowrap;}
.chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
.chip.ok{color:var(--ok); background:var(--ok-wash);}
.chip.warn{color:var(--warn); background:var(--warn-wash);}
.chip.crit{color:var(--crit); background:var(--crit-wash);}
.chip.none{color:var(--ink-faint); background:var(--paper3);}
.pill{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:99px; background:var(--paper3); color:var(--ink-soft); white-space:nowrap;}
.pill.accent{background:var(--accent-50); color:var(--accent);}
.pill.gold{background:var(--gold-50); color:var(--gold-dark);}
.pill.crit{background:var(--crit-wash); color:var(--crit);}
.pill.ok{background:var(--ok-wash); color:var(--ok);}

/* Forms */
label.fl{display:block; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 4px;}
input[type=text],input[type=date],input[type=datetime-local],textarea,select.inp{width:100%; background:var(--paper); border:1px solid var(--line-strong); border-radius:6px; padding:9px 11px; font-size:15px;}
textarea{min-height:74px; resize:vertical; line-height:1.5;}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-100); border-color:var(--accent);}
.field{margin-bottom:14px;}
.hint{font-size:12.5px; color:var(--ink-faint); margin-top:4px; max-width:70ch;}
.hint b{color:var(--gold-dark); font-weight:600;}

/* Segmented control */
.seg{display:inline-flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; flex-wrap:wrap;}
.seg button{appearance:none; border:none; background:var(--paper2); padding:7px 13px; font-size:13.5px; font-weight:500; color:var(--ink-soft); border-left:1px solid var(--line);}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:600;}
.seg.small button{padding:5px 10px; font-size:12.5px;}

/* Choice cards (Wizard Schritt 1) */
.choices{display:grid; gap:10px;}
.choice{display:block; width:100%; text-align:left; background:var(--paper2); border:1px solid var(--line-strong); border-radius:6px; padding:14px 16px;}
.choice:hover{border-color:var(--accent);}
.choice .t{font-family:'Newsreader',Georgia,serif; font-size:17px; display:block; margin-bottom:2px;}
.choice .s{font-size:13px; color:var(--ink-soft); display:block;}

/* Warum-Erklärungen */
details.warum{border-left:3px solid var(--gold-dark); background:var(--gold-50); border-radius:0 6px 6px 0; margin:10px 0 4px; font-size:13.5px;}
details.warum summary{cursor:pointer; padding:8px 12px; font-weight:600; color:var(--gold-dark); list-style:none; font-size:12px; letter-spacing:.06em; text-transform:uppercase;}
details.warum summary::-webkit-details-marker{display:none}
details.warum summary::before{content:"?"; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; border:1.5px solid var(--gold-dark); margin-right:7px; font-size:11px;}
details.warum .wb{padding:0 12px 10px; color:var(--ink-soft); max-width:75ch;}
details.warum .wq{display:block; margin-top:6px; font-size:11.5px; color:var(--ink-faint);}

/* Prüffrage-Kasten (accent) */
.leitfrage{padding:10px 14px; background:var(--accent-50); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; font-size:13.5px; color:var(--ink-soft); margin-bottom:12px;}
.leitfrage b{color:var(--accent); font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:11px; display:block; margin-bottom:2px;}

/* Risikomatrix */
.risk-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.risk-row:last-child{border-bottom:none}
.risk-name{font-weight:500; min-width:110px;}
.risk-detail{width:100%; margin-top:6px;}

/* Bericht-Liste */
.b-entry{border:1px solid var(--line); border-radius:6px; background:var(--paper2); padding:12px 14px; margin-bottom:10px;}
.b-entry .b-head{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; margin-bottom:6px;}
.b-entry .b-ts{font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}
.b-entry .b-text{margin:0 0 6px; white-space:pre-wrap;}
.b-entry .b-kette{font-size:13px; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:6px; margin-top:6px;}
.b-entry .b-kette b{font-weight:600; color:var(--ink);}
.day-h{font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin:18px 0 8px;}

/* Maßnahmen */
.m-card{border:1px solid var(--line); border-radius:6px; background:var(--paper2); padding:12px 14px; margin-bottom:10px;}
.m-card.beendet{opacity:.55}
.m-card .m-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap;}
.m-card .m-wie{color:var(--ink-soft); font-size:14px; margin:4px 0 6px; white-space:pre-wrap;}
.zeit-h{font-family:'Newsreader',Georgia,serif; font-size:19px; margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--line-strong);}
.zeit-h:first-child{margin-top:0}
.zeit-h .zn{color:var(--gold);}

/* Handlungsbedarf */
.todo{display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border:1px solid var(--line); border-left:3px solid var(--crit); border-radius:0 6px 6px 0; background:var(--paper2); margin-bottom:8px;}
.todo.warn{border-left-color:var(--warn)}
.todo.info{border-left-color:var(--gold)}
.todo .tx{flex:1}
.todo .tx small{display:block; color:var(--ink-faint); font-size:12px;}

/* Modal */
.modal-bg{position:fixed; inset:0; background:rgba(24,20,17,.45); z-index:50; display:none; align-items:flex-end; justify-content:center; padding:0;}
@media(min-width:640px){.modal-bg{align-items:center; padding:24px;}}
.modal-bg.open{display:flex}
.modal{background:var(--paper); width:100%; max-width:620px; max-height:92dvh; overflow-y:auto; border-radius:12px 12px 0 0; border:1px solid var(--line-strong); padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));}
@media(min-width:640px){.modal{border-radius:10px;}}
.modal .m-head{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:14px;}
.modal .m-head h2{font-size:21px}
.m-close{appearance:none; border:none; background:var(--paper3); color:var(--ink-soft); border-radius:50%; width:30px; height:30px; font-size:16px; line-height:1; flex-shrink:0;}

/* Immer-so Panel */
.immerso{border:1px solid var(--line-strong); border-left:3px solid var(--ok); background:var(--ok-wash); border-radius:0 6px 6px 0; padding:14px 16px;}
.immerso h3{color:var(--ok); margin-bottom:6px;}

/* Toast */
#toasts{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); z-index:99; display:flex; flex-direction:column; gap:8px; width:min(420px, calc(100vw - 32px));}
.toast{background:var(--ink); color:var(--paper); padding:11px 16px; border-radius:8px; font-size:14px; box-shadow:0 4px 14px rgba(0,0,0,.25); animation:tin .2s ease;}
@keyframes tin{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

.empty{border:1px dashed var(--line-strong); border-radius:6px; padding:28px 20px; text-align:center; color:var(--ink-faint); margin-bottom:14px;}
.empty .serif{font-size:18px; color:var(--ink-soft); display:block; margin-bottom:4px;}
footer{border-top:1px solid var(--line); margin-top:48px; padding-top:14px;}
@media print{ .tabs,.bw-bar,.btn,#toasts{display:none !important} body{background:#fff;color:#000} }
</style>
</head>
<body>
<div class="wrap">

<header class="hdr">
  <div class="hdr-top">
    <div>
      <div class="eyebrow">SIS-Assist · Strukturmodell</div>
      <h1>Pflegeprozess<em>-Werkzeug</em></h1>
      <p class="faint" style="margin:0">Steuern statt nachweisen: SIS → Maßnahmenplan → Bericht (Abweichung) → Evaluation.</p>
    </div>
    <div class="row">
      <button class="btn small ghost" id="btnExport">Export</button>
      <button class="btn small ghost" id="btnImport">Import</button>
      <input type="file" id="fileImport" accept=".json" hidden>
    </div>
  </div>
  <div class="bw-bar">
    <select id="bwSelect" aria-label="Bewohner:in wählen"></select>
    <button class="btn small" id="btnBwNeu">+ Neu</button>
    <button class="btn small ghost" id="btnBwUmben">Umbenennen</button>
    <button class="btn small ghost danger" id="btnBwDel">Löschen</button>
    <span class="faint" id="saveInfo" style="margin-left:auto"></span>
  </div>
</header>

<nav class="tabs" role="tablist" id="tabBar"></nav>
<main id="panel"></main>

<footer class="spread">
  <span class="faint">SIS-Assist · Prototyp „Pflegeprozess-Werkzeug“ · Daten liegen nur in diesem Browser (localStorage)</span>
  <span class="faint">Kein Ersatz für die interne QM-Regelung · <a href="legacy.html" style="color:inherit">bisherige SIS-App</a></span>
</footer>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= Konstanten ================= */
const LS_KEY = 'sisassist.prozess.v1';
const TF = [
  {k:'tf1', name:'Kognition & Kommunikation', leit:'Orientierung, Verstehen, Sich-mitteilen – was gelingt, was braucht Unterstützung?'},
  {k:'tf2', name:'Mobilität & Beweglichkeit', leit:'Wie bewegt sich die Person fort, was schafft sie selbst, wo und wie unterstützt Du?'},
  {k:'tf3', name:'Krankheitsbezogene Anforderungen & Belastungen', leit:'Diagnosen mit Alltagsfolgen, Schmerzen, Therapien – was heißt das konkret für die Pflege?'},
  {k:'tf4', name:'Selbstversorgung', leit:'Waschen, Kleiden, Essen, Ausscheiden – was macht die Person selbst, was ist ihr dabei wichtig?'},
  {k:'tf5', name:'Leben in sozialen Beziehungen', leit:'Kontakte, Rollen, Tagesgestaltung, was Freude macht – und was belastet?'},
  {k:'tf6', name:'Wohnen & Häuslichkeit', leit:'Zimmer als privater Raum, Orientierung im Wohnbereich, mitgebrachte Gewohnheiten.'}
];
const RISK = [
  {k:'dekubitus', name:'Dekubitus'},
  {k:'sturz', name:'Sturz'},
  {k:'inkontinenz', name:'Inkontinenz'},
  {k:'schmerz', name:'Schmerz'},
  {k:'ernaehrung', name:'Ernährung'},
  {k:'sonstiges', name:'Sonstiges'}
];
const ZEITEN = [
  {k:'morgens', name:'Morgens'},
  {k:'vormittags', name:'Vormittags'},
  {k:'mittags', name:'Mittags'},
  {k:'nachmittags', name:'Nachmittags'},
  {k:'abends', name:'Abends'},
  {k:'nachts', name:'Nachts'},
  {k:'situativ', name:'Situativ / bei Bedarf'}
];
const ABW_ART = {
  nicht:'nicht durchgeführt', abgelehnt:'von der Person abgelehnt',
  anders:'anders durchgeführt als geplant', selbst:'Person hat es selbst übernommen'
};
const EREIGNIS_KAT = ['Sturz','Schmerz','Haut','Essen & Trinken','Vigilanz / Verhalten','Infekt / Fieber','Sonstiges'];
const EVAL_ANLASS = {
  veraenderung:'Zustandsveränderung', ereignis:'Ereignis (z. B. Sturz)',
  klinik:'Rückkehr aus der Klinik', risiko:'Neues Risiko erkannt',
  regel:'Interne Regel (spätestens halbjährlich)', abweichungen:'Gehäufte Abweichungen vom Plan'
};
const EVAL_INTERVALL_TAGE = 183; // interne Regel: halbjährlich

/* Warum-Texte – destilliert aus dem Tutorial (Handbuch Strukturmodell v2.0, MD-Hinweise 11/2019, QPR 2024, BGB, PflBG) */
const WARUM = {
  eingang: {t:'Die Person kommt zuerst zu Wort – wörtlich oder sinngemäß in ihrer Sprache. Floskeln („möchte gut versorgt werden“) liefern keine Steuerungsinformation. Bei kognitiven Einschränkungen tritt die Fremdauskunft hinzu – dann muss erkennbar sein, wessen Sicht hier steht.', q:'Handbuch Strukturmodell (Feld A); § 2 SGB XI'},
  themenfelder: {t:'Die sechs Themenfelder sind der fachliche Blick der Pflegefachkraft: Risiken, Ressourcen und Bedarfe werden erzählt statt angekreuzt. Ein leeres oder mit „o. B.“ abgefertigtes Feld ist ein Einschätzungsverzicht. Eine fremde Fachkraft muss aus dem Text die konkrete Person erkennen.', q:'Handbuch Strukturmodell (Feld B); MD-Hinweise 2019'},
  matrix: {t:'Die Matrix ist die pflichtgemäße Risikoeinschätzung zu den Kernrisiken. „Weitere Einschätzung notwendig“ ist kein Makel, sondern der fachlich saubere Weg: erst differenziert einschätzen (Instrument oder begründete fachliche Einschätzung), dann entscheiden.', q:'Handbuch Strukturmodell (Feld C); DNQP-Expertenstandards'},
  ableitung: {t:'Der rote Faden des Pflegeprozesses: Jedes erkannte Risiko muss sich im Plan wiederfinden – und keine Maßnahme sollte ohne erhobene Grundlage im Plan stehen. Deshalb verlangt dieses Werkzeug für jede Maßnahme einen Bezug. Die Ableitung des Pflegeprozesses ist nach § 4 PflBG Fachkraft-Aufgabe.', q:'Handbuch Strukturmodell (Element 2); § 4 PflBG; QPR 2024'},
  tagesstruktur: {t:'Der Plan ist nicht nach Pflegeproblemen sortiert, sondern am gelebten Tag der Person entlang: Wer den Frühdienst übernimmt, liest in Minuten, wie diese Person ihren Morgen gestaltet. Ein „Standardtag“, der auf halb so viele Bewohner:innen genauso passt, verfehlt den Zweck.', q:'Handbuch Strukturmodell; § 2 SGB XI'},
  immerso: {t:'Was im Plan als Regelversorgung steht, gilt als erbracht – ohne tägliches Abzeichnen. Dieses Privileg trägt nur ein konkreter, aktueller Plan: Was, wie, wann, durch wen muss für Vertretung und Einarbeitung eindeutig sein.', q:'MD-Hinweise 2019; § 630f BGB (Beweisfunktion)'},
  abweichung: {t:'Das Berichteblatt ist kein Tagebuch, sondern ein Abweichungs- und Ereignisprotokoll. „Gut geschlafen, Frühstück eingenommen“ hat keinen Informationswert, wenn es dem Plan entspricht – Routineeinträge kosten Zeit und verstecken die relevanten Signale. Der Verzicht auf Einzelleistungsnachweise gilt nur zusammen mit konsequenter Abweichungsdokumentation.', q:'Handbuch Strukturmodell (Element 3); MD-Hinweise 2019'},
  reaktion: {t:'Ein Ereignis ohne dokumentierte Reaktion ist der gefährlichste Berichteintrag: „Gestürzt, ins Bett gebracht“ – und dann? Zur Kette gehören Sofortmaßnahme, Information der Beteiligten, Verlaufsbeobachtung und ggf. die Rückkopplung in SIS und Plan. Genau diese Kette wollen MD und im Ernstfall ein Gericht nachvollziehen.', q:'§§ 630f, 630h BGB (Rechtsgedanke); DNQP Sturzprophylaxe 2022'},
  sachlich: {t:'Beobachtung statt Etikett: „lehnt Frühstück und Mittagessen ab, schiebt Teller weg“ statt „bockig“. Jeder Eintrag ist potenziell gelesener Text – Bewohner:in, Angehörige und Betreuungsgericht haben Einsichtsrecht.', q:'§ 630f, § 630g BGB; Art. 15 DSGVO'},
  evalAnlass: {t:'Das Strukturmodell ersetzt starre Fristen durch zwei Trigger: den Anlass (Ereignis, Veränderung, Klinik, neues Risiko) und die interne Regel als Sicherheitsnetz für schleichende Veränderungen. Datum und Handzeichen machen die Evaluation als bewussten fachlichen Akt erkennbar – nicht als stillschweigendes „passt schon“.', q:'Handbuch Strukturmodell (Element 4); § 4 PflBG'},
  evalWirkung: {t:'„Maßnahme fortführen“ als Dauerschleife ohne Begründung ist keine Evaluation, sondern ein Abhak-Ritual. Wirksamkeit braucht einen Bezugspunkt: Woran zeigt sich Erfolg – Gewicht stabil, keine neuen Stürze, kommt wieder zum Mittagstisch? Wo etwas nicht wirkt, ist genau das der wertvollste Befund.', q:'DNQP-Expertenstandards; QPR 2024'},
  evalKonsequenz: {t:'Eine Evaluation ohne Konsequenz ist Dokumentationsfolklore. Das Ergebnis muss nachvollziehbar zu SIS, Matrix und Plan zurückfließen. Auch das begründete „keine Änderung erforderlich“ ist eine legitime Konsequenz – aber als Entscheidung erkennbar, nicht als Schweigen.', q:'Handbuch Strukturmodell; MuG nach § 113 SGB XI'}
};

/* ================= State ================= */
let store = load();
let tab = 'start';
let saveTimer = null;

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && Array.isArray(s.bewohner)) return s; }
  }catch(e){}
  return {v:1, hz:'', activeId:null, bewohner:[]};
}
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); el('saveInfo').textContent = 'Gespeichert ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}); }
  catch(e){ toast('Speichern fehlgeschlagen – Speicher voll?'); }
}
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(persist, 400); el('saveInfo').textContent='…'; }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; el('toasts').appendChild(t); setTimeout(()=>t.remove(), 3600); }
function fmtTs(ts){ const d=new Date(ts); return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+' Uhr'; }
function fmtDay(ts){ return new Date(ts).toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'}); }
function nowLocal(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function daysSince(ts){ return Math.floor((Date.now()-ts)/86400000); }
function rec(x){ return x.rec || x.ts; } // Aufnahmezeitpunkt (sekundengenau) für Werkzeug-Logik; ts bleibt die dokumentierte Zeit

function neuBewohner(name){
  const b = {
    id: uid(), name: name,
    sis: { anlass:'', datum:'', pfk:'',
      eingang:{text:'', quelle:'', fremdWer:''},
      themenfelder:{tf1:'',tf2:'',tf3:'',tf4:'',tf5:'',tf6:''},
      risiken: Object.fromEntries(RISK.map(r=>[r.k,{s:'',text:'',label:''}])) },
    massnahmen:[], berichte:[], evaluationen:[]
  };
  store.bewohner.push(b); store.activeId = b.id; persist(); return b;
}
function aktiv(){ return store.bewohner.find(b=>b.id===store.activeId) || null; }

/* ================= Fach-Logik: Handlungsbedarf ================= */
function checkHandlungsbedarf(b){
  const out = [];
  if(!b) return out;
  const s = b.sis;
  if(!s.eingang.text.trim())
    out.push({lvl:'warn', tab:'sis', t:'Die Eingangsfrage ist noch unbeantwortet.', s:'Der Verständigungsprozess ist der personzentrierte Einstieg – die Sicht der Person kommt zuerst.'});
  const leereTf = TF.filter(f=>!s.themenfelder[f.k].trim());
  if(s.eingang.text.trim() && leereTf.length)
    out.push({lvl:'warn', tab:'sis', t: leereTf.length+' von 6 Themenfeldern sind noch leer.', s:'Ein leeres Themenfeld ist ein Einschätzungsverzicht: '+leereTf.map(f=>f.name).join(', ')+'.'});
  RISK.forEach(r=>{
    const ri = s.risiken[r.k];
    const rname = r.k==='sonstiges' && ri.label ? ri.label : r.name;
    if(ri.s==='we' && !ri.text.trim())
      out.push({lvl:'crit', tab:'sis', t:'Risiko „'+rname+'“: differenzierte Einschätzung fehlt.', s:'„Weitere Einschätzung notwendig“ verlangt ein Instrument oder eine begründete fachliche Einschätzung – mit Datum und Handzeichen.'});
    if(ri.s==='ja'){
      const verknuepft = b.massnahmen.some(m=>m.status==='aktiv' && m.bezug.risiken.includes(r.k));
      if(!verknuepft)
        out.push({lvl:'crit', tab:'plan', t:'Risiko „'+rname+'“ ist bejaht – aber keine aktive Maßnahme nimmt darauf Bezug.', s:'Prüfrichtung „von der Matrix in den Plan“: erkanntes Risiko ohne Maßnahme ist eine Lücke im roten Faden.'});
    }
  });
  b.massnahmen.filter(m=>m.status==='aktiv').forEach(m=>{
    if(!m.bezug.risiken.length && !m.bezug.felder.length)
      out.push({lvl:'warn', tab:'plan', t:'Maßnahme „'+m.titel+'“ hat keinen Bezug zu SIS oder Risikomatrix.', s:'Keine Maßnahme ohne erhobene Grundlage – sonst ist die Ableitung nicht nachvollziehbar.'});
  });
  b.berichte.filter(e=>e.reaktion && e.reaktion.folgen && !e.erledigt).forEach(e=>{
    out.push({lvl:'crit', tab:'bericht', t:'Rückkopplung offen: „'+(e.text.length>60?e.text.slice(0,60)+'…':e.text)+'“', s:'Du hast markiert, dass dieses Ereignis Folgen für SIS oder Plan hat – die Anpassung steht noch aus.', id:e.id});
  });
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(rec)) : null;
  b.massnahmen.filter(m=>m.status==='aktiv').forEach(m=>{
    const n = b.berichte.filter(e=>e.mId===m.id && e.typ==='abweichung' && (!letzteEval || rec(e)>letzteEval)).length;
    if(n>=3)
      out.push({lvl:'info', tab:'eval', t:n+' Abweichungen zu „'+m.titel+'“ seit der letzten Evaluation.', s:'Gehäufte Abweichungen sind ein Evaluationsanlass: Passt die Maßnahme noch zur Person?'});
  });
  b.evaluationen.forEach(ev=>{
    ev.items.filter(i=>i.konsequenz==='anpassen').forEach(i=>{
      const m = b.massnahmen.find(x=>x.id===i.mId);
      if(m && (!m.updated || m.updated < rec(ev)))
        out.push({lvl:'warn', tab:'plan', t:'Evaluation vom '+new Date(ev.ts).toLocaleDateString('de-DE')+': „'+m.titel+'“ sollte angepasst werden.', s:'Konsequenz ohne Umsetzung ist Dokumentationsfolklore – Plan anpassen oder Entscheidung revidieren.'});
    });
  });
  if(letzteEval && daysSince(letzteEval) > EVAL_INTERVALL_TAGE)
    out.push({lvl:'warn', tab:'eval', t:'Letzte Evaluation liegt '+daysSince(letzteEval)+' Tage zurück.', s:'Interne Regel (Sicherheitsnetz): spätestens halbjährlich, zusätzlich anlassbezogen.'});
  if(!letzteEval && b.massnahmen.some(m=>m.status==='aktiv') && b.sis.datum){
    const start = new Date(b.sis.datum).getTime();
    if(!isNaN(start) && daysSince(start) > EVAL_INTERVALL_TAGE)
      out.push({lvl:'warn', tab:'eval', t:'Seit Beginn des Pflegeprozesses wurde noch nie evaluiert.', s:'Wirkt, was wir tun? Die Evaluation schließt den Regelkreis.'});
  }
  return out;
}

/* ================= Rendering ================= */
function warum(key){
  const w = WARUM[key];
  return '<details class="warum"><summary>Warum?</summary><div class="wb">'+esc(w.t)+'<span class="wq">'+esc(w.q)+'</span></div></details>';
}

function renderTabs(){
  const b = aktiv();
  const todos = checkHandlungsbedarf(b);
  const crit = todos.some(t=>t.lvl==='crit');
  const defs = [
    {k:'start', n:'Übersicht', cnt: todos.length||'', alert:crit},
    {k:'sis', n:'SIS'},
    {k:'plan', n:'Maßnahmenplan', cnt: b? b.massnahmen.filter(m=>m.status==='aktiv').length : ''},
    {k:'bericht', n:'Bericht', cnt: b? b.berichte.length : ''},
    {k:'eval', n:'Evaluation', cnt: b? b.evaluationen.length : ''}
  ];
  el('tabBar').innerHTML = defs.map(d=>
    '<button class="tab" role="tab" aria-selected="'+(tab===d.k)+'" data-tab="'+d.k+'">'+d.n+
    (d.cnt ? '<span class="cnt num">'+d.cnt+'</span>':'')+
    (d.alert && d.k==='start' ? '<span class="dot-alert" title="Dringender Handlungsbedarf"></span>':'')+'</button>').join('');
  el('tabBar').querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{ tab=btn.dataset.tab; render(); window.scrollTo({top:0}); });
}

function renderBwBar(){
  const sel = el('bwSelect');
  if(!store.bewohner.length){ sel.innerHTML = '<option value="">– noch keine Bewohner:in –</option>'; sel.disabled = true; }
  else{
    sel.disabled = false;
    sel.innerHTML = store.bewohner.map(b=>'<option value="'+b.id+'"'+(b.id===store.activeId?' selected':'')+'>'+esc(b.name)+'</option>').join('');
  }
}

function render(){
  renderBwBar(); renderTabs();
  const b = aktiv();
  const p = el('panel');
  if(!b){
    p.innerHTML = '<div class="empty"><span class="serif">Noch keine Bewohner:in angelegt</span>'+
      'Leg mit „+ Neu“ die erste Person an – danach führt Dich das Werkzeug durch SIS, Plan, Bericht und Evaluation.</div>';
    return;
  }
  if(tab==='start') p.innerHTML = vStart(b);
  else if(tab==='sis') p.innerHTML = vSis(b);
  else if(tab==='plan') p.innerHTML = vPlan(b);
  else if(tab==='bericht') p.innerHTML = vBericht(b);
  else if(tab==='eval') p.innerHTML = vEval(b);
  bindPanel(b);
}

/* ---------- Übersicht ---------- */
function vStart(b){
  const todos = checkHandlungsbedarf(b);
  const b14 = b.berichte.filter(e=>daysSince(e.ts)<=14);
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(e=>e.ts)) : null;
  const letzte = b.berichte.slice().sort((a,c)=>c.ts-a.ts).slice(0,5);
  return `
  <div class="kpis">
    <div class="kpi"><div class="v num">${todos.length}<span class="dot">.</span></div><div class="l">Offene Punkte</div></div>
    <div class="kpi"><div class="v num">${b.massnahmen.filter(m=>m.status==='aktiv').length}<span class="dot">.</span></div><div class="l">Aktive Maßnahmen</div></div>
    <div class="kpi"><div class="v num">${b14.length}<span class="dot">.</span></div><div class="l">Berichte · 14 Tage</div></div>
    <div class="kpi"><div class="v num">${letzteEval? daysSince(letzteEval)+' T':'–'}</div><div class="l">Seit letzter Evaluation</div></div>
  </div>
  <div class="section-head spread"><h2>Handlungsbedarf</h2><span class="faint">Das Werkzeug denkt in der Logik des Regelkreises mit</span></div>
  ${todos.length ? todos.map(t=>`
    <div class="todo ${t.lvl==='crit'?'':t.lvl}">
      <div class="tx">${esc(t.t)}<small>${esc(t.s)}</small></div>
      <button class="btn small" data-goto="${t.tab}">Öffnen</button>
    </div>`).join('') :
    '<div class="immerso"><h3>Alles im grünen Bereich</h3><p style="margin:0">SIS, Plan, Bericht und Evaluation sind konsistent – keine offenen Punkte. Die Regelversorgung weist der Plan nach (Immer-so-Prinzip).</p></div>'}
  <div class="section-head spread"><h2>Letzte Berichtseinträge</h2>
    <button class="btn small primary" data-goto-bericht-neu>+ Eintrag</button></div>
  ${letzte.length ? letzte.map(e=>bEntry(b,e,true)).join('') : '<div class="empty">Noch keine Einträge – gut möglich, dass das richtig ist: Routine gehört nicht ins Berichteblatt.</div>'}`;
}

/* ---------- SIS ---------- */
function segBtn(group, val, cur, label){
  return '<button data-seg="'+group+'" data-val="'+val+'" aria-pressed="'+(cur===val)+'">'+label+'</button>';
}
function vSis(b){
  const s = b.sis;
  return `
  <div class="leitfrage"><b>Element 1 · Strukturierte Informationssammlung</b>
  Verständigung mit der Person, fachliche Einschätzung in sechs Themenfeldern, Risikoeinschätzung in der Matrix. Erhebung und Feststellung des Pflegebedarfs sind Fachkraft-Aufgabe (§ 4 PflBG).</div>

  <div class="card">
    <div class="grid g2">
      <div class="field"><label class="fl">Anlass</label>
        <div class="seg small" id="segAnlass">
          ${segBtn('anlass','einzug',s.anlass,'Einzug')}${segBtn('anlass','rueckkehr',s.anlass,'Rückkehr Klinik')}${segBtn('anlass','veraenderung',s.anlass,'Wesentl. Veränderung')}
        </div></div>
      <div class="field"><label class="fl" for="sisDatum">Datum</label><input type="date" id="sisDatum" value="${esc(s.datum)}"></div>
      <div class="field"><label class="fl" for="sisPfk">Verantwortliche PFK (Handzeichen)</label><input type="text" id="sisPfk" value="${esc(s.pfk)}" placeholder="z. B. DM"></div>
    </div>
  </div>

  <div class="section-head"><h2>Verständigungsprozess</h2></div>
  <div class="card">
    <div class="field"><label class="fl" for="sisEingang">„Was bewegt Sie im Augenblick? Was brauchen Sie? Was können wir für Sie tun?“</label>
      <textarea id="sisEingang" placeholder="Möglichst im O-Ton der Person …">${esc(s.eingang.text)}</textarea>
      <div class="hint">Wörtlich oder sinngemäß in <b>ihrer Sprache</b> – keine Pflegefloskeln.</div></div>
    <div class="field"><label class="fl">Wessen Sicht ist das?</label>
      <div class="seg small" id="segQuelle">
        ${segBtn('quelle','selbst',s.eingang.quelle,'Person selbst')}${segBtn('quelle','fremd',s.eingang.quelle,'Fremdauskunft')}${segBtn('quelle','beides',s.eingang.quelle,'Beides')}
      </div></div>
    ${s.eingang.quelle==='fremd'||s.eingang.quelle==='beides' ? `<div class="field"><label class="fl" for="sisFremd">Fremdauskunft durch</label><input type="text" id="sisFremd" value="${esc(s.eingang.fremdWer)}" placeholder="z. B. Tochter, rechtl. Betreuerin, Biografiebogen"></div>`:''}
    ${warum('eingang')}
  </div>

  <div class="section-head"><h2>Sechs Themenfelder</h2></div>
  ${warum('themenfelder')}
  <div class="grid" style="margin-top:10px">
    ${TF.map((f,i)=>`<div class="card tight">
      <div class="spread"><h3>${i+1} · ${f.name}</h3>${s.themenfelder[f.k].trim()?'<span class="chip ok">bearbeitet</span>':'<span class="chip none">offen</span>'}</div>
      <div class="hint" style="margin:4px 0 8px">${f.leit}</div>
      <textarea data-tf="${f.k}" placeholder="Individuell beschreiben: was kann die Person, was braucht sie, was ist ihr wichtig?">${esc(s.themenfelder[f.k])}</textarea>
    </div>`).join('')}
  </div>

  <div class="section-head"><h2>Risikomatrix</h2></div>
  ${warum('matrix')}
  <div class="card" style="margin-top:10px">
    ${RISK.map(r=>{
      const ri = s.risiken[r.k];
      const isSonst = r.k==='sonstiges';
      return `<div class="risk-row">
        <span class="risk-name">${isSonst? '<input type="text" data-risklabel="'+r.k+'" value="'+esc(ri.label)+'" placeholder="Sonstiges …" style="max-width:160px">' : r.name}</span>
        <div class="seg small">
          ${segBtn('risk:'+r.k,'ja',ri.s,'Risiko ja')}${segBtn('risk:'+r.k,'nein',ri.s,'nein')}${segBtn('risk:'+r.k,'we',ri.s,'weitere Einschätzung')}
        </div>
        ${ri.s==='we' ? `<div class="risk-detail">
          <textarea data-risktext="${r.k}" placeholder="Differenzierte Einschätzung: Instrument (z. B. Braden, BESD) oder begründete fachliche Einschätzung – mit Datum und Handzeichen.">${esc(ri.text)}</textarea>
          ${!ri.text.trim()?'<div class="hint"><b>Offen:</b> ohne differenzierte Einschätzung bleibt die Matrix hier unvollständig.</div>':''}
        </div>`:''}
        ${ri.s==='ja' ? (function(){
          const n = b.massnahmen.filter(m=>m.status==='aktiv' && m.bezug.risiken.includes(r.k)).length;
          return '<div class="risk-detail hint">'+(n? '✓ '+n+' Maßnahme'+(n>1?'n':'')+' im Plan verknüpft.' : '<b>Noch keine Maßnahme verknüpft</b> – erkanntes Risiko braucht eine Antwort im Plan.')+'</div>';
        })():''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------- Maßnahmenplan ---------- */
function bezugLabel(b, m){
  const teile = [];
  m.bezug.risiken.forEach(k=>{ const r=RISK.find(x=>x.k===k); const ri=b.sis.risiken[k];
    teile.push('<span class="pill accent">Risiko: '+esc(k==='sonstiges'&&ri.label?ri.label:r.name)+'</span>'); });
  m.bezug.felder.forEach(k=>{ const f=TF.find(x=>x.k===k); teile.push('<span class="pill">'+esc(f.name)+'</span>'); });
  return teile.join(' ');
}
function vPlan(b){
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  const beendete = b.massnahmen.filter(m=>m.status!=='aktiv');
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(rec)) : null;
  const abwCount = m => b.berichte.filter(e=>e.mId===m.id && e.typ==='abweichung' && (!letzteEval || rec(e)>letzteEval)).length;
  const proZeit = z => aktive.filter(m=>m.zeiten.includes(z.k));
  return `
  <div class="leitfrage"><b>Element 2 · Maßnahmenplan</b>
  Übersetzt die SIS in konkrete, tagesstrukturierte Versorgung – und ist die Referenz für das Immer-so-Prinzip: Was hier steht, gilt als erbracht, ohne täglich abgezeichnet zu werden.</div>
  ${warum('tagesstruktur')}${warum('immerso')}
  <div class="row" style="margin:14px 0 6px"><button class="btn primary" id="btnMNeu">+ Maßnahme</button>
  <span class="faint">${aktive.length} aktiv${beendete.length? ' · '+beendete.length+' beendet':''}</span></div>
  ${aktive.length===0 ? '<div class="empty"><span class="serif">Noch keine Maßnahmen</span>Leite sie aus der SIS ab: Jedes bejahte Risiko und jeder beschriebene Unterstützungsbedarf braucht eine Antwort im Plan.</div>' : ''}
  ${ZEITEN.map(z=>{
    const ms = proZeit(z); if(!ms.length) return '';
    return '<div class="zeit-h">'+z.name+' <span class="zn num">· '+ms.length+'</span></div>'+
      ms.map(m=>{
        const n = abwCount(m);
        return `<div class="m-card">
          <div class="m-top"><h3>${esc(m.titel)}</h3>
            <span class="row">${n?'<span class="pill gold num">'+n+' Abw. seit Eval</span>':''}
            <button class="btn small ghost" data-medit="${m.id}">Bearbeiten</button></span></div>
          ${m.wie?'<div class="m-wie">'+esc(m.wie)+'</div>':''}
          ${m.eigen?'<div class="hint" style="margin-bottom:6px">Eigenaktivität: '+esc(m.eigen)+'</div>':''}
          <div class="row">${bezugLabel(b,m)||'<span class="pill crit">ohne Bezug – bitte begründen</span>'}</div>
        </div>`;
      }).join('');
  }).join('')}
  ${beendete.length? '<div class="zeit-h">Beendet</div>'+beendete.map(m=>`<div class="m-card beendet"><div class="m-top"><h3>${esc(m.titel)}</h3><button class="btn small ghost" data-medit="${m.id}">Ansehen</button></div></div>`).join(''):''}`;
}

/* ---------- Bericht ---------- */
function bEntry(b, e, compact){
  const m = e.mId ? b.massnahmen.find(x=>x.id===e.mId) : null;
  const typPill = e.typ==='abweichung' ? '<span class="pill accent">Abweichung</span>'
    : e.typ==='ereignis' ? '<span class="pill crit">'+esc(e.kat||'Ereignis')+'</span>'
    : '<span class="pill ok">Positive Entwicklung</span>';
  let kette = '';
  if(e.typ==='ereignis' && e.reaktion){
    const r = e.reaktion;
    kette = '<div class="b-kette">'+
      (r.sofort?'<b>Sofort:</b> '+esc(r.sofort)+'<br>':'')+
      (r.informiert && r.informiert.length?'<b>Informiert:</b> '+esc(r.informiert.join(', '))+'<br>':'')+
      (r.verlauf?'<b>Verlauf beobachten:</b> '+esc(r.verlauf)+'<br>':'')+
      (r.folgen? '<b>Rückkopplung SIS/Plan:</b> '+(e.erledigt?'<span class="pill ok">erledigt</span>':'<span class="pill crit">offen</span> <button class="btn small" data-erledigt="'+e.id+'">Als angepasst markieren</button>') : '')+
      '</div>';
  }
  return `<div class="b-entry">
    <div class="b-head">${typPill}${m?'<span class="pill">'+esc(m.titel)+'</span>':''}
      ${e.typ==='abweichung'&&e.art?'<span class="faint">'+esc(ABW_ART[e.art]||e.art)+'</span>':''}
      <span class="b-ts" style="margin-left:auto">${fmtTs(e.ts)} · Hz ${esc(e.hz)}</span></div>
    <p class="b-text">${esc(e.text)}</p>
    ${compact?'':kette}
    ${compact&&e.typ==='ereignis'&&e.reaktion&&e.reaktion.folgen&&!e.erledigt?'<span class="pill crit">Rückkopplung offen</span>':''}
  </div>`;
}
function vBericht(b){
  const sorted = b.berichte.slice().sort((a,c)=>c.ts-a.ts);
  let html = `
  <div class="leitfrage"><b>Element 3 · Berichteblatt</b>
  Kein Tagebuch, sondern ein Abweichungs- und Ereignisprotokoll: Was war heute anders, neu, auffällig? Die Regelversorgung weist der Plan nach – nicht der Bericht.</div>
  ${warum('abweichung')}
  <div class="row" style="margin:14px 0 4px"><button class="btn primary" id="btnBNeu">+ Eintrag</button>
  <span class="faint">Prüfblick: Lässt sich in 60 Sekunden erkennen, was in den letzten zwei Wochen besonders war?</span></div>`;
  if(!sorted.length){
    html += '<div class="empty"><span class="serif">Keine Einträge</span>Das kann genau richtig sein: Solange alles wie geplant läuft, gilt das Immer-so-Prinzip.</div>';
  } else {
    let lastDay = '';
    sorted.forEach(e=>{
      const day = fmtDay(e.ts);
      if(day!==lastDay){ html += '<div class="day-h">'+day+'</div>'; lastDay = day; }
      html += bEntry(b,e,false);
    });
  }
  return html;
}

/* ---------- Evaluation ---------- */
function vEval(b){
  const sorted = b.evaluationen.slice().sort((a,c)=>c.ts-a.ts);
  return `
  <div class="leitfrage"><b>Element 4 · Evaluation</b>
  Schließt den Regelkreis: Wirkt, was wir tun – und was folgt daraus? Anlassbezogen statt kalendergetrieben; Fachkraft-Aufgabe nach § 4 PflBG.</div>
  ${warum('evalAnlass')}
  <div class="row" style="margin:14px 0 6px"><button class="btn primary" id="btnEvNeu" ${b.massnahmen.some(m=>m.status==='aktiv')?'':'disabled title="Erst Maßnahmen anlegen"'}>+ Evaluation durchführen</button></div>
  ${sorted.length===0 ? '<div class="empty"><span class="serif">Noch keine Evaluation</span>Anlässe: Zustandsveränderung, Ereignis, Klinikrückkehr, neues Risiko – und als Sicherheitsnetz die interne Regel (halbjährlich).</div>' : ''}
  ${sorted.map(ev=>`
    <div class="card">
      <div class="spread"><h3>${esc(EVAL_ANLASS[ev.anlass]||ev.anlass)}</h3>
        <span class="faint num">${fmtTs(ev.ts)} · Hz ${esc(ev.pfk)}</span></div>
      ${ev.notiz?'<p class="muted" style="margin:6px 0">'+esc(ev.notiz)+'</p>':''}
      ${ev.items.map(i=>{
        const m = b.massnahmen.find(x=>x.id===i.mId);
        const wPill = i.wirksam==='ja'?'<span class="pill ok">wirksam</span>': i.wirksam==='teilweise'?'<span class="pill gold">teilweise wirksam</span>':'<span class="pill crit">nicht wirksam</span>';
        const kPill = i.konsequenz==='beibehalten'?'<span class="pill">beibehalten</span>': i.konsequenz==='anpassen'?'<span class="pill gold">anpassen</span>':'<span class="pill crit">beendet</span>';
        return `<div style="border-top:1px solid var(--line); padding:8px 0 2px; margin-top:8px">
          <div class="row"><strong>${esc(m?m.titel:'(gelöschte Maßnahme)')}</strong>${wPill}${kPill}</div>
          ${i.woran?'<div class="hint">Woran erkennbar: '+esc(i.woran)+'</div>':''}
          ${i.begr?'<div class="hint">Begründung: '+esc(i.begr)+'</div>':''}
        </div>`;
      }).join('')}
    </div>`).join('')}`;
}

/* ================= Modals & Wizards ================= */
function openModal(html){ el('modalBox').innerHTML = html; el('modalBg').classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(){ el('modalBg').classList.remove('open'); document.body.style.overflow=''; }
el('modalBg').addEventListener('click', e=>{ if(e.target===el('modalBg')) closeModal(); });

function mHead(title, sub){
  return '<div class="m-head"><div><h2>'+title+'</h2>'+(sub?'<div class="faint">'+sub+'</div>':'')+'</div><button class="m-close" onclick="closeModal()" aria-label="Schließen">×</button></div>';
}

/* --- Bericht-Wizard --- */
function wizBericht(){
  const b = aktiv(); if(!b) return;
  openModal(mHead('Welche Abweichung vom Maßnahmenplan<br>möchtest Du dokumentieren?','Das Berichteblatt hält fest, was <em>anders</em> war als geplant.')+`
  <div class="choices">
    <button class="choice" data-wiz="abweichung"><span class="t">Eine geplante Maßnahme lief anders</span>
      <span class="s">Nicht durchgeführt, abgelehnt, anders gemacht – oder die Person hat es selbst übernommen.</span></button>
    <button class="choice" data-wiz="ereignis"><span class="t">Etwas ist passiert oder mir aufgefallen</span>
      <span class="s">Sturz, Schmerz, Hautveränderung, verändertes Verhalten … – mit Reaktionskette.</span></button>
    <button class="choice" data-wiz="positiv"><span class="t">Etwas hat sich verbessert</span>
      <span class="s">Positive Entwicklung, wiedergewonnene Fähigkeit – auch das ist eine Abweichung.</span></button>
    <button class="choice" data-wiz="routine"><span class="t">Eigentlich lief alles wie geplant</span>
      <span class="s">Dann zeigt Dir das Werkzeug, warum kein Eintrag nötig ist.</span></button>
  </div>`);
  el('modalBox').querySelectorAll('[data-wiz]').forEach(btn=>btn.onclick=()=>{
    const t = btn.dataset.wiz;
    if(t==='routine') wizRoutine();
    else if(t==='abweichung') wizAbweichung();
    else if(t==='ereignis') wizEreignis();
    else wizPositiv();
  });
}

function wizRoutine(){
  openModal(mHead('Kein Eintrag nötig','Das ist keine Lücke – das ist das System.')+`
  <div class="immerso">
    <h3>Das Immer-so-Prinzip</h3>
    <p>Die Regelversorgung wird über den <strong>Maßnahmenplan</strong> nachgewiesen, nicht über den Bericht. Was dort als geplante Versorgung steht, gilt als erbracht – ohne tägliches Abzeichnen und ohne „Grundpflege erfolgt“-Einträge.</p>
    <p>Ein Berichteblatt voller Routine ist doppelt schädlich: Es kostet Deine Zeit und versteckt die relevanten Einträge zwischen Füllmaterial. Der Verzicht auf Einzelleistungsnachweise ist genau daran geknüpft, dass nur Abweichungen berichtet werden.</p>
    <p class="faint" style="margin:0">Handbuch Strukturmodell (Element 3) · MD-Hinweise 11/2019</p>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" onclick="closeModal()">Verstanden – kein Eintrag</button>
    <button class="btn ghost" id="wRdoch">Es war doch etwas anders …</button>
  </div>`);
  el('wRdoch').onclick = wizBericht;
}

function hzInput(){
  return `<div class="grid g2">
    <div class="field"><label class="fl" for="wTs">Datum & Uhrzeit</label><input type="datetime-local" id="wTs" value="${nowLocal()}"></div>
    <div class="field"><label class="fl" for="wHz">Handzeichen</label><input type="text" id="wHz" value="${esc(store.hz)}" placeholder="z. B. DM"></div>
  </div>`;
}
function readTsHz(){
  const ts = new Date(el('wTs').value).getTime() || Date.now();
  const hz = el('wHz').value.trim();
  if(!hz){ toast('Handzeichen fehlt – jeder Eintrag muss zurechenbar sein.'); return null; }
  store.hz = hz;
  return {ts, hz};
}

function wizAbweichung(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  if(!aktive.length){
    openModal(mHead('Noch kein Maßnahmenplan','')+
      '<p>Eine Abweichung braucht einen Plan, von dem abgewichen wird. Leg zuerst die Maßnahmen an – oder dokumentiere ein <strong>Ereignis</strong>.</p>'+
      '<div class="row"><button class="btn primary" id="wZuPlan">Zum Maßnahmenplan</button><button class="btn ghost" id="wZuEreignis">Ereignis dokumentieren</button></div>');
    el('wZuPlan').onclick=()=>{ closeModal(); tab='plan'; render(); };
    el('wZuEreignis').onclick=wizEreignis;
    return;
  }
  openModal(mHead('Abweichung von einer Maßnahme','Schritt 2 von 2')+`
  <div class="field"><label class="fl" for="wM">Welche Maßnahme?</label>
    <select class="inp" id="wM">${aktive.map(m=>'<option value="'+m.id+'">'+esc(m.titel)+'</option>').join('')}</select></div>
  <div class="field"><label class="fl">Was war los?</label>
    <div class="seg small" id="wArt">${Object.entries(ABW_ART).map(([k,v],i)=>'<button data-art="'+k+'" aria-pressed="'+(i===0)+'">'+v+'</button>').join('')}</div></div>
  <div class="field"><label class="fl" for="wText">Beschreibung – und wie hast Du reagiert?</label>
    <textarea id="wText" placeholder="z. B.: Lehnt die Begleitung zum Mittagstisch ab, möchte im Zimmer essen. Tablett gebracht, Trinkmenge beobachtet."></textarea>
    <div class="hint"><b>Sachlich bleiben:</b> Beobachtung statt Etikett – beschreib, was Du gesehen und getan hast.</div></div>
  ${hzInput()}
  ${warum('sachlich')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  let art = 'nicht';
  el('wArt').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    art = btn.dataset.art;
    el('wArt').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    if(!text){ toast('Ohne Beschreibung kein Eintrag.'); return; }
    const th = readTsHz(); if(!th) return;
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'abweichung', mId:el('wM').value, art, text});
    persist(); closeModal(); tab='bericht'; render(); toast('Abweichung dokumentiert.');
  };
}

function wizEreignis(){
  const b = aktiv();
  openModal(mHead('Ereignis oder Beobachtung','Mit Reaktionskette – sie ist es, die zählt.')+`
  <div class="field"><label class="fl">Kategorie</label>
    <div class="seg small" id="wKat">${EREIGNIS_KAT.map((k,i)=>'<button data-kat="'+esc(k)+'" aria-pressed="'+(i===0)+'">'+esc(k)+'</button>').join('')}</div></div>
  <div class="field"><label class="fl" for="wText">Was hast Du beobachtet?</label>
    <textarea id="wText" placeholder="Sachlich und konkret: was, wo, seit wann, wie ausgeprägt?"></textarea>
    <div class="hint"><b>Sachlich bleiben:</b> „schiebt den Teller weg, isst 2 Löffel“ statt „unkooperativ“.</div></div>
  <div class="field"><label class="fl" for="wSofort">Sofortmaßnahme / erste Reaktion</label>
    <textarea id="wSofort" placeholder="Was hast Du unmittelbar getan?"></textarea></div>
  <div class="field"><label class="fl">Wer wurde informiert?</label>
    <div class="row" id="wInf">
      ${['Arzt/Ärztin','Angehörige / Betreuung','PDL / WBL','Niemand erforderlich'].map(x=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')}
    </div></div>
  <div class="field"><label class="fl" for="wVerlauf">Was beobachtest Du weiter? (optional)</label>
    <input type="text" id="wVerlauf" placeholder="z. B. 24-h-Sturzbeobachtung, Schmerz, Vigilanz, Trinkmenge"></div>
  <div class="field"><label class="fl">Hat das Folgen für SIS oder Maßnahmenplan?</label>
    <div class="seg small" id="wFolgen"><button data-f="nein" aria-pressed="true">Nein</button><button data-f="ja" aria-pressed="false">Ja – Anpassung nötig</button></div>
    <div class="hint">Bei „Ja“ merkt sich das Werkzeug die offene Rückkopplung, bis SIS/Plan angepasst sind.</div></div>
  ${hzInput()}
  ${warum('reaktion')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  let kat = EREIGNIS_KAT[0], folgen = false;
  el('wKat').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    kat = btn.dataset.kat; el('wKat').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wFolgen').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    folgen = btn.dataset.f==='ja'; el('wFolgen').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    const sofort = el('wSofort').value.trim();
    if(!text){ toast('Ohne Beobachtung kein Eintrag.'); return; }
    if(!sofort){ toast('Ein Ereignis ohne dokumentierte Reaktion ist der gefährlichste Eintrag – bitte Sofortmaßnahme ergänzen.'); return; }
    const th = readTsHz(); if(!th) return;
    const informiert = Array.from(el('wInf').querySelectorAll('input:checked')).map(x=>x.value);
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'ereignis', kat, text,
      reaktion:{sofort, informiert, verlauf: el('wVerlauf').value.trim(), folgen}, erledigt:false});
    persist(); closeModal(); tab='bericht'; render();
    toast(folgen? 'Ereignis dokumentiert – Rückkopplung in SIS/Plan ist als offen vermerkt.' : 'Ereignis mit Reaktionskette dokumentiert.');
  };
}

function wizPositiv(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  openModal(mHead('Positive Entwicklung','Auch Verbesserungen sind Abweichungen – die schönsten.')+`
  <div class="field"><label class="fl" for="wText">Was hat sich verbessert?</label>
    <textarea id="wText" placeholder="z. B.: Geht die Strecke zum Speisesaal seit drei Tagen ohne Pause, wirkt sicherer."></textarea></div>
  ${aktive.length?`<div class="field"><label class="fl" for="wM">Bezug zu einer Maßnahme (optional)</label>
    <select class="inp" id="wM"><option value="">– kein Bezug –</option>${aktive.map(m=>'<option value="'+m.id+'">'+esc(m.titel)+'</option>').join('')}</select>
    <div class="hint">Wenn eine Maßnahme wirkt oder Unterstützung reduziert werden kann: guter Anlass für eine Evaluation.</div></div>`:''}
  ${hzInput()}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    if(!text){ toast('Ohne Beschreibung kein Eintrag.'); return; }
    const th = readTsHz(); if(!th) return;
    const mId = el('wM') ? el('wM').value || null : null;
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'positiv', mId, text});
    persist(); closeModal(); tab='bericht'; render(); toast('Positive Entwicklung dokumentiert.');
  };
}

/* --- Maßnahmen-Editor --- */
function wizMassnahme(mid){
  const b = aktiv();
  const m = mid ? b.massnahmen.find(x=>x.id===mid) : null;
  const risiken = RISK.filter(r=> b.sis.risiken[r.k].s==='ja' || b.sis.risiken[r.k].s==='we' || (m && m.bezug.risiken.includes(r.k)));
  openModal(mHead(m?'Maßnahme bearbeiten':'Neue Maßnahme','Konkret genug für Vertretung und Einarbeitung: Was, wie, wann, durch wen.')+`
  <div class="field"><label class="fl" for="mTitel">Maßnahme (Was?)</label>
    <input type="text" id="mTitel" value="${esc(m?m.titel:'')}" placeholder="z. B. Begleitung zum Mittagstisch"></div>
  <div class="field"><label class="fl" for="mWie">Wie genau? Hilfsmittel, Besonderheiten</label>
    <textarea id="mWie" placeholder="z. B.: Transfer mit Rollator und Begleitung einer Person, Abstützen rechts wegen Hemiparese links.">${esc(m?m.wie:'')}</textarea>
    <div class="hint">„Mobilisation nach Bedarf“ ist nicht handlungsleitend – Details gehören hierher, nicht in den Kopf des Wohnbereichs.</div></div>
  <div class="field"><label class="fl" for="mEigen">Was übernimmt die Person selbst?</label>
    <input type="text" id="mEigen" value="${esc(m?m.eigen:'')}" placeholder="z. B. wäscht Gesicht und Oberkörper selbständig"></div>
  <div class="field"><label class="fl">Wann? (Tagesstruktur)</label>
    <div class="row" id="mZeiten">${ZEITEN.map(z=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+z.k+'"'+(m&&m.zeiten.includes(z.k)?' checked':'')+'> '+z.name+'</label>').join('')}</div></div>
  <div class="field"><label class="fl">Begründung: Worauf bezieht sich die Maßnahme?</label>
    ${risiken.length?'<div style="margin-bottom:6px"><span class="faint">Risiken aus der Matrix:</span><div class="row" id="mBezR">'+risiken.map(r=>{
      const ri=b.sis.risiken[r.k]; const nm = r.k==='sonstiges'&&ri.label?ri.label:r.name;
      return '<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+r.k+'"'+(m&&m.bezug.risiken.includes(r.k)?' checked':'')+'> '+esc(nm)+'</label>';
    }).join('')+'</div></div>':''}
    <div><span class="faint">Themenfelder der SIS:</span><div class="row" id="mBezF">${TF.map(f=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+f.k+'"'+(m&&m.bezug.felder.includes(f.k)?' checked':'')+'> '+f.name+'</label>').join('')}</div></div>
    <div class="hint">Keine Maßnahme ohne erhobene Grundlage – der rote Faden von der SIS in den Plan.</div></div>
  ${warum('ableitung')}
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="mSave">${m?'Speichern':'Anlegen'}</button>
    ${m && m.status==='aktiv' ? '<button class="btn ghost danger" id="mEnd">Maßnahme beenden</button>':''}
    ${m && m.status!=='aktiv' ? '<button class="btn ghost" id="mReakt">Reaktivieren</button>':''}
  </div>`);
  el('mSave').onclick = ()=>{
    const titel = el('mTitel').value.trim();
    if(!titel){ toast('Die Maßnahme braucht einen Namen.'); return; }
    const zeiten = Array.from(el('mZeiten').querySelectorAll('input:checked')).map(x=>x.value);
    if(!zeiten.length){ toast('Wann? Ohne Tagesstruktur ist der Plan kein Arbeitsinstrument.'); return; }
    const bezR = el('mBezR') ? Array.from(el('mBezR').querySelectorAll('input:checked')).map(x=>x.value) : [];
    const bezF = Array.from(el('mBezF').querySelectorAll('input:checked')).map(x=>x.value);
    if(m){
      Object.assign(m, {titel, wie:el('mWie').value.trim(), eigen:el('mEigen').value.trim(), zeiten, bezug:{risiken:bezR, felder:bezF}, updated:Date.now()});
    } else {
      b.massnahmen.push({id:uid(), titel, wie:el('mWie').value.trim(), eigen:el('mEigen').value.trim(), zeiten,
        bezug:{risiken:bezR, felder:bezF}, status:'aktiv', created:Date.now(), updated:Date.now()});
    }
    persist(); closeModal(); render(); toast(m?'Maßnahme aktualisiert.':'Maßnahme angelegt.');
  };
  const end = el('mEnd'); if(end) end.onclick = ()=>{ m.status='beendet'; m.updated=Date.now(); persist(); closeModal(); render(); toast('Maßnahme beendet.'); };
  const rea = el('mReakt'); if(rea) rea.onclick = ()=>{ m.status='aktiv'; m.updated=Date.now(); persist(); closeModal(); render(); };
}

/* --- Evaluations-Wizard --- */
function wizEval(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  if(!aktive.length) return;
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(rec)) : null;
  const abw = m => b.berichte.filter(e=>e.mId===m.id && e.typ==='abweichung' && (!letzteEval || rec(e)>letzteEval)).length;
  openModal(mHead('Evaluation','Wirkt, was wir tun – und was folgt daraus?')+`
  <div class="field"><label class="fl" for="evAnlass">Anlass</label>
    <select class="inp" id="evAnlass">${Object.entries(EVAL_ANLASS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')}</select></div>
  <div class="field"><label class="fl" for="evNotiz">Beteiligung der Person / Bezugspersonen</label>
    <input type="text" id="evNotiz" placeholder="z. B.: Gespräch mit Frau M.; Tochter telefonisch einbezogen">
    <div class="hint">Evaluation ist kein Verwaltungsakt über die Person hinweg – ihre Einschätzung gehört in die Bewertung (soweit möglich).</div></div>
  <div id="evItems">
  ${aktive.map(m=>`
    <div class="card tight" data-ev="${m.id}">
      <div class="spread"><h3>${esc(m.titel)}</h3>${abw(m)?'<span class="pill gold num">'+abw(m)+' Abweichungen seit letzter Eval</span>':'<span class="pill">keine Abweichungen</span>'}</div>
      <div class="field" style="margin-top:8px"><label class="fl">Wirksam?</label>
        <div class="seg small" data-role="wirksam"><button data-v="ja">Ja</button><button data-v="teilweise">Teilweise</button><button data-v="nein">Nein</button></div></div>
      <div class="field"><label class="fl">Woran erkennbar?</label>
        <input type="text" data-role="woran" placeholder="z. B. keine neuen Stürze, Gewicht stabil, kommt wieder zum Mittagstisch"></div>
      <div class="field" style="margin-bottom:6px"><label class="fl">Konsequenz</label>
        <div class="seg small" data-role="konsequenz"><button data-v="beibehalten">Beibehalten</button><button data-v="anpassen">Anpassen</button><button data-v="beenden">Beenden</button></div></div>
      <div class="field" style="margin-bottom:4px"><label class="fl">Begründung</label>
        <input type="text" data-role="begr" placeholder="Auch „keine Änderung erforderlich“ braucht eine erkennbare Entscheidung"></div>
    </div>`).join('')}
  </div>
  ${hzInput()}
  ${warum('evalWirkung')}${warum('evalKonsequenz')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="evSave">Evaluation abschließen</button></div>`);
  el('modalBox').querySelectorAll('.seg[data-role]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
    });
  });
  el('evSave').onclick = ()=>{
    const th = readTsHz(); if(!th) return;
    const items = [];
    let fehlt = false;
    el('modalBox').querySelectorAll('[data-ev]').forEach(card=>{
      const wBtn = card.querySelector('.seg[data-role=wirksam] button[aria-pressed="true"]');
      const kBtn = card.querySelector('.seg[data-role=konsequenz] button[aria-pressed="true"]');
      const woran = card.querySelector('[data-role=woran]').value.trim();
      const begr = card.querySelector('[data-role=begr]').value.trim();
      if(!wBtn || !kBtn){ fehlt = true; return; }
      if(wBtn.dataset.v!=='ja' && !begr && kBtn.dataset.v==='beibehalten'){ fehlt='begr'; card.style.borderColor='var(--crit)'; return; }
      items.push({mId:card.dataset.ev, wirksam:wBtn.dataset.v, woran, konsequenz:kBtn.dataset.v, begr});
    });
    if(fehlt==='begr'){ toast('„Nicht wirksam, trotzdem beibehalten“ braucht eine Begründung – sonst ist es ein Abhak-Ritual.'); return; }
    if(fehlt){ toast('Bitte für jede Maßnahme Wirksamkeit und Konsequenz bewerten.'); return; }
    const ev = {id:uid(), ts:th.ts, rec:Date.now(), pfk:th.hz, anlass:el('evAnlass').value, notiz:el('evNotiz').value.trim(), items};
    b.evaluationen.push(ev);
    items.filter(i=>i.konsequenz==='beenden').forEach(i=>{
      const m = b.massnahmen.find(x=>x.id===i.mId); if(m){ m.status='beendet'; m.updated=Date.now(); }
    });
    persist(); closeModal(); tab='eval'; render();
    const anz = items.filter(i=>i.konsequenz==='anpassen').length;
    toast(anz? 'Evaluation gespeichert – '+anz+' Maßnahme(n) warten auf Anpassung im Plan.' : 'Evaluation gespeichert – Regelkreis geschlossen.');
  };
}

/* ================= Event-Bindings ================= */
function bindPanel(b){
  const p = el('panel');
  p.querySelectorAll('[data-goto]').forEach(btn=>btn.onclick=()=>{ tab=btn.dataset.goto; render(); window.scrollTo({top:0}); });
  const bn = p.querySelector('[data-goto-bericht-neu]'); if(bn) bn.onclick = wizBericht;
  /* SIS */
  const bindTxt = (id, fn) => { const n = el(id); if(n) n.oninput = e=>{ fn(e.target.value); save(); }; };
  bindTxt('sisDatum', v=>b.sis.datum=v);
  bindTxt('sisPfk', v=>b.sis.pfk=v);
  bindTxt('sisEingang', v=>b.sis.eingang.text=v);
  bindTxt('sisFremd', v=>b.sis.eingang.fremdWer=v);
  p.querySelectorAll('[data-tf]').forEach(t=>t.oninput = e=>{ b.sis.themenfelder[t.dataset.tf]=e.target.value; save(); });
  p.querySelectorAll('[data-risktext]').forEach(t=>t.oninput = e=>{ b.sis.risiken[t.dataset.risktext].text=e.target.value; save(); });
  p.querySelectorAll('[data-risklabel]').forEach(t=>t.oninput = e=>{ b.sis.risiken[t.dataset.risklabel].label=e.target.value; save(); });
  p.querySelectorAll('[data-seg]').forEach(btn=>btn.onclick=()=>{
    const g = btn.dataset.seg, v = btn.dataset.val;
    if(g==='anlass') b.sis.anlass = (b.sis.anlass===v?'':v);
    else if(g==='quelle') b.sis.eingang.quelle = v;
    else if(g.startsWith('risk:')){ const k=g.slice(5); b.sis.risiken[k].s = (b.sis.risiken[k].s===v?'':v); }
    persist(); render();
  });
  /* Plan */
  const mn = el('btnMNeu'); if(mn) mn.onclick = ()=>wizMassnahme(null);
  p.querySelectorAll('[data-medit]').forEach(btn=>btn.onclick=()=>wizMassnahme(btn.dataset.medit));
  /* Bericht */
  const bneu = el('btnBNeu'); if(bneu) bneu.onclick = wizBericht;
  p.querySelectorAll('[data-erledigt]').forEach(btn=>btn.onclick=()=>{
    const e = b.berichte.find(x=>x.id===btn.dataset.erledigt);
    if(e){ e.erledigt = true; persist(); render(); toast('Rückkopplung als erledigt markiert.'); }
  });
  /* Eval */
  const ev = el('btnEvNeu'); if(ev) ev.onclick = wizEval;
}

/* Kopf-Leiste */
el('bwSelect').onchange = e=>{ store.activeId = e.target.value; persist(); tab='start'; render(); };
el('btnBwNeu').onclick = ()=>{
  openModal(mHead('Neue Bewohner:in','Name oder Kürzel – bitte datensparsam.')+
    '<div class="field"><input type="text" id="nbName" placeholder="z. B. Frau M. (Zi. 12)"></div>'+
    '<button class="btn primary" id="nbSave">Anlegen</button>');
  el('nbName').focus();
  el('nbSave').onclick = ()=>{
    const n = el('nbName').value.trim(); if(!n){ toast('Name fehlt.'); return; }
    neuBewohner(n); closeModal(); tab='sis'; render();
    toast('Angelegt – Einstieg ist die SIS: die Person kommt zuerst zu Wort.');
  };
  el('nbName').onkeydown = e=>{ if(e.key==='Enter') el('nbSave').click(); };
};
el('btnBwUmben').onclick = ()=>{
  const b = aktiv(); if(!b) return;
  openModal(mHead('Umbenennen','')+
    '<div class="field"><input type="text" id="rnName" value="'+esc(b.name)+'"></div>'+
    '<button class="btn primary" id="rnSave">Speichern</button>');
  el('rnSave').onclick = ()=>{ const n=el('rnName').value.trim(); if(n){ b.name=n; persist(); closeModal(); render(); } };
};
el('btnBwDel').onclick = ()=>{
  const b = aktiv(); if(!b) return;
  openModal(mHead('Wirklich löschen?','')+
    '<p>„'+esc(b.name)+'“ mit SIS, Plan, '+b.berichte.length+' Berichten und '+b.evaluationen.length+' Evaluationen unwiderruflich löschen?</p>'+
    '<div class="row"><button class="btn danger" id="delYes">Ja, löschen</button><button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>');
  el('delYes').onclick = ()=>{
    store.bewohner = store.bewohner.filter(x=>x.id!==b.id);
    store.activeId = store.bewohner.length? store.bewohner[0].id : null;
    persist(); closeModal(); render(); toast('Gelöscht.');
  };
};
el('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sis-assist-prozess-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
el('btnImport').onclick = ()=> el('fileImport').click();
el('fileImport').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if(!s || !Array.isArray(s.bewohner)) throw 0;
      store = s; if(!store.activeId && store.bewohner.length) store.activeId = store.bewohner[0].id;
      persist(); render(); toast('Import erfolgreich: '+store.bewohner.length+' Bewohner:in(nen).');
    }catch(err){ toast('Import fehlgeschlagen – keine gültige Exportdatei.'); }
  };
  r.readAsText(f); e.target.value='';
};

/* Init */
if(!store.activeId && store.bewohner.length) store.activeId = store.bewohner[0].id;
render();
</script>
