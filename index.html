/* ---------- Maßnahmenplan ---------- */
function bezugLabel(b, m){
  const teile = [];
  m.bezug.risiken.forEach(k=>{ const r=RISK.find(x=>x.k===k); const ri=b.sis.risiken[k];
    teile.push('<span class="pill accent">Risiko: '+esc(k==='sonstiges'&&ri.label?ri.label:r.name)+'</span>'); });
  m.bezug.felder.forEach(k=>{ const f=TF.find(x=>x.k===k); teile.push('<span class="pill">'+esc(f.name)+'</span>'); });
  return teile.join(' ');
}
function vPlan(b){
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  const beendete = b.massnahmen.filter(m=>m.status!=='aktiv');
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(rec)) : null;
  const abwCount = m => b.berichte.filter(e=>e.mId===m.id && e.typ==='abweichung' && (!letzteEval || rec(e)>letzteEval)).length;
  const proZeit = z => aktive.filter(m=>m.zeiten.includes(z.k));
  return `
  <div class="leitfrage"><b>Element 2 · Maßnahmenplan</b>
  Übersetzt die SIS in konkrete, tagesstrukturierte Versorgung – und ist die Referenz für das Immer-so-Prinzip: Was hier steht, gilt als erbracht, ohne täglich abgezeichnet zu werden.</div>
  ${warum('tagesstruktur')}${warum('immerso')}
  <div class="row" style="margin:14px 0 6px"><button class="btn primary" id="btnMNeu">+ Maßnahme</button>
  <span class="faint">${aktive.length} aktiv${beendete.length? ' · '+beendete.length+' beendet':''}</span></div>
  ${aktive.length===0 ? '<div class="empty"><span class="serif">Noch keine Maßnahmen</span>Leite sie aus der SIS ab: Jedes bejahte Risiko und jeder beschriebene Unterstützungsbedarf braucht eine Antwort im Plan.</div>' : ''}
  ${ZEITEN.map(z=>{
    const ms = proZeit(z); if(!ms.length) return '';
    return '<div class="zeit-h">'+z.name+' <span class="zn num">· '+ms.length+'</span></div>'+
      ms.map(m=>{
        const n = abwCount(m);
        return `<div class="m-card">
          <div class="m-top"><h3>${esc(m.titel)}</h3>
            <span class="row">${hatPlatzhalter(m)?'<span class="pill gold ph-open" title="Beispielangaben in eckigen Klammern noch festlegen">Platzhalter offen</span>':''}${n?'<span class="pill gold num">'+n+' Abw. seit Eval</span>':''}
            <button class="btn small ghost" data-medit="${m.id}">Bearbeiten</button></span></div>
          ${m.wie?'<div class="m-wie">'+esc(m.wie)+'</div>':''}
          ${m.eigen?'<div class="hint" style="margin-bottom:6px">Eigenaktivität: '+esc(m.eigen)+'</div>':''}
          <div class="row">${bezugLabel(b,m)||'<span class="pill crit">ohne Bezug – bitte begründen</span>'}</div>
        </div>`;
      }).join('');
  }).join('')}
  ${beendete.length? '<div class="zeit-h">Beendet</div>'+beendete.map(m=>`<div class="m-card beendet"><div class="m-top"><h3>${esc(m.titel)}</h3><button class="btn small ghost" data-medit="${m.id}">Ansehen</button></div></div>`).join(''):''}`;
}

/* ---------- Bericht ---------- */
function bEntry(b, e, compact){
  const m = e.mId ? b.massnahmen.find(x=>x.id===e.mId) : null;
  const typPill = e.typ==='abweichung' ? '<span class="pill accent">Abweichung</span>'
    : e.typ==='ereignis' ? '<span class="pill crit">'+esc(e.kat||'Ereignis')+'</span>'
    : '<span class="pill ok">Positive Entwicklung</span>';
  let kette = '';
  if(e.typ==='ereignis' && e.reaktion){
    const r = e.reaktion;
    kette = '<div class="b-kette">'+
      (r.sofort?'<b>Sofort:</b> '+esc(r.sofort)+'<br>':'')+
      (r.informiert && r.informiert.length?'<b>Informiert:</b> '+esc(r.informiert.join(', '))+'<br>':'')+
      (r.verlauf?'<b>Verlauf beobachten:</b> '+esc(r.verlauf)+'<br>':'')+
      (r.folgen? '<b>Rückkopplung SIS/Plan:</b> '+(e.erledigt?'<span class="pill ok">erledigt</span>':'<span class="pill crit">offen</span> <button class="btn small" data-erledigt="'+e.id+'">Als angepasst markieren</button>') : '')+
      '</div>';
  }
  return `<div class="b-entry">
    <div class="b-head">${typPill}${m?'<span class="pill">'+esc(m.titel)+'</span>':''}
      ${e.typ==='abweichung'&&e.art?'<span class="faint">'+esc(ABW_ART[e.art]||e.art)+'</span>':''}
      <span class="b-ts" style="margin-left:auto">${fmtTs(e.ts)} · Hz ${esc(e.hz)}</span></div>
    <p class="b-text">${esc(e.text)}</p>
    ${compact?'':kette}
    ${compact&&e.typ==='ereignis'&&e.reaktion&&e.reaktion.folgen&&!e.erledigt?'<span class="pill crit">Rückkopplung offen</span>':''}
  </div>`;
}
function vBericht(b){
  const sorted = b.berichte.slice().sort((a,c)=>c.ts-a.ts);
  let html = `
  <div class="leitfrage"><b>Element 3 · Berichteblatt</b>
  Kein Tagebuch, sondern ein Abweichungs- und Ereignisprotokoll: Was war heute anders, neu, auffällig? Die Regelversorgung weist der Plan nach – nicht der Bericht.</div>
  ${warum('abweichung')}
  <div class="row" style="margin:14px 0 4px"><button class="btn primary" id="btnBNeu">+ Eintrag</button>
  <span class="faint">Prüfblick: Lässt sich in 60 Sekunden erkennen, was in den letzten zwei Wochen besonders war?</span></div>`;
  if(!sorted.length){
    html += '<div class="empty"><span class="serif">Keine Einträge</span>Das kann genau richtig sein: Solange alles wie geplant läuft, gilt das Immer-so-Prinzip.</div>';
  } else {
    let lastDay = '';
    sorted.forEach(e=>{
      const day = fmtDay(e.ts);
      if(day!==lastDay){ html += '<div class="day-h">'+day+'</div>'; lastDay = day; }
      html += bEntry(b,e,false);
    });
  }
  return html;
}

/* ---------- Evaluation ---------- */
function vEval(b){
  const sorted = b.evaluationen.slice().sort((a,c)=>c.ts-a.ts);
  return `
  <div class="leitfrage"><b>Element 4 · Evaluation</b>
  Schließt den Regelkreis: Wirkt, was wir tun – und was folgt daraus? Anlassbezogen statt kalendergetrieben; Fachkraft-Aufgabe nach § 4 PflBG.</div>
  ${warum('evalAnlass')}
  <div class="row" style="margin:14px 0 6px"><button class="btn primary" id="btnEvNeu" ${b.massnahmen.some(m=>m.status==='aktiv')?'':'disabled title="Erst Maßnahmen anlegen"'}>+ Evaluation durchführen</button></div>
  ${sorted.length===0 ? '<div class="empty"><span class="serif">Noch keine Evaluation</span>Anlässe: Zustandsveränderung, Ereignis, Klinikrückkehr, neues Risiko – und als Sicherheitsnetz die interne Regel (halbjährlich).</div>' : ''}
  ${sorted.map(ev=>`
    <div class="card">
      <div class="spread"><h3>${esc(EVAL_ANLASS[ev.anlass]||ev.anlass)}</h3>
        <span class="faint num">${fmtTs(ev.ts)} · Hz ${esc(ev.pfk)}</span></div>
      ${ev.notiz?'<p class="muted" style="margin:6px 0">'+esc(ev.notiz)+'</p>':''}
      ${ev.items.map(i=>{
        const m = b.massnahmen.find(x=>x.id===i.mId);
        const wPill = i.wirksam==='ja'?'<span class="pill ok">wirksam</span>': i.wirksam==='teilweise'?'<span class="pill gold">teilweise wirksam</span>':'<span class="pill crit">nicht wirksam</span>';
        const kPill = i.konsequenz==='beibehalten'?'<span class="pill">beibehalten</span>': i.konsequenz==='anpassen'?'<span class="pill gold">anpassen</span>':'<span class="pill crit">beendet</span>';
        return `<div style="border-top:1px solid var(--line); padding:8px 0 2px; margin-top:8px">
          <div class="row"><strong>${esc(m?m.titel:'(gelöschte Maßnahme)')}</strong>${wPill}${kPill}</div>
          ${i.woran?'<div class="hint">Woran erkennbar: '+esc(i.woran)+'</div>':''}
          ${i.begr?'<div class="hint">Begründung: '+esc(i.begr)+'</div>':''}
        </div>`;
      }).join('')}
    </div>`).join('')}`;
}

/* ================= Modals & Wizards ================= */
function openModal(html){ el('modalBox').innerHTML = html; el('modalBg').classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(){ el('modalBg').classList.remove('open'); document.body.style.overflow=''; }
el('modalBg').addEventListener('click', e=>{ if(e.target===el('modalBg')) closeModal(); });

function mHead(title, sub){
  return '<div class="m-head"><div><h2>'+title+'</h2>'+(sub?'<div class="faint">'+sub+'</div>':'')+'</div><button class="m-close" onclick="closeModal()" aria-label="Schließen">×</button></div>';
}

/* --- Bericht-Wizard --- */
function wizBericht(){
  const b = aktiv(); if(!b) return;
  openModal(mHead('Welche Abweichung vom Maßnahmenplan<br>möchtest Du dokumentieren?','Das Berichteblatt hält fest, was <em>anders</em> war als geplant.')+`
  <div class="choices">
    <button class="choice" data-wiz="abweichung"><span class="t">Eine geplante Maßnahme lief anders</span>
      <span class="s">Nicht durchgeführt, abgelehnt, anders gemacht – oder die Person hat es selbst übernommen.</span></button>
    <button class="choice" data-wiz="ereignis"><span class="t">Etwas ist passiert oder mir aufgefallen</span>
      <span class="s">Sturz, Schmerz, Hautveränderung, verändertes Verhalten … – mit Reaktionskette.</span></button>
    <button class="choice" data-wiz="positiv"><span class="t">Etwas hat sich verbessert</span>
      <span class="s">Positive Entwicklung, wiedergewonnene Fähigkeit – auch das ist eine Abweichung.</span></button>
    <button class="choice" data-wiz="routine"><span class="t">Eigentlich lief alles wie geplant</span>
      <span class="s">Dann zeigt Dir das Werkzeug, warum kein Eintrag nötig ist.</span></button>
  </div>`);
  el('modalBox').querySelectorAll('[data-wiz]').forEach(btn=>btn.onclick=()=>{
    const t = btn.dataset.wiz;
    if(t==='routine') wizRoutine();
    else if(t==='abweichung') wizAbweichung();
    else if(t==='ereignis') wizEreignis();
    else wizPositiv();
  });
}

function wizRoutine(){
  openModal(mHead('Kein Eintrag nötig','Das ist keine Lücke – das ist das System.')+`
  <div class="immerso">
    <h3>Das Immer-so-Prinzip</h3>
    <p>Die Regelversorgung wird über den <strong>Maßnahmenplan</strong> nachgewiesen, nicht über den Bericht. Was dort als geplante Versorgung steht, gilt als erbracht – ohne tägliches Abzeichnen und ohne „Grundpflege erfolgt“-Einträge.</p>
    <p>Ein Berichteblatt voller Routine ist doppelt schädlich: Es kostet Deine Zeit und versteckt die relevanten Einträge zwischen Füllmaterial. Der Verzicht auf Einzelleistungsnachweise ist genau daran geknüpft, dass nur Abweichungen berichtet werden.</p>
    <p class="faint" style="margin:0">Handbuch Strukturmodell (Element 3) · MD-Hinweise 11/2019</p>
  </div>
  <div class="row" style="margin-top:14px">
    <button class="btn primary" onclick="closeModal()">Verstanden – kein Eintrag</button>
    <button class="btn ghost" id="wRdoch">Es war doch etwas anders …</button>
  </div>`);
  el('wRdoch').onclick = wizBericht;
}

function hzInput(){
  return `<div class="grid g2">
    <div class="field"><label class="fl" for="wTs">Datum & Uhrzeit</label><input type="datetime-local" id="wTs" value="${nowLocal()}"></div>
    <div class="field"><label class="fl" for="wHz">Handzeichen</label><input type="text" id="wHz" value="${esc(store.hz)}" placeholder="z. B. DM"></div>
  </div>`;
}
function readTsHz(){
  const ts = new Date(el('wTs').value).getTime() || Date.now();
  const hz = el('wHz').value.trim();
  if(!hz){ toast('Handzeichen fehlt – jeder Eintrag muss zurechenbar sein.'); return null; }
  store.hz = hz;
  return {ts, hz};
}

function wizAbweichung(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  if(!aktive.length){
    openModal(mHead('Noch kein Maßnahmenplan','')+
      '<p>Eine Abweichung braucht einen Plan, von dem abgewichen wird. Leg zuerst die Maßnahmen an – oder dokumentiere ein <strong>Ereignis</strong>.</p>'+
      '<div class="row"><button class="btn primary" id="wZuPlan">Zum Maßnahmenplan</button><button class="btn ghost" id="wZuEreignis">Ereignis dokumentieren</button></div>');
    el('wZuPlan').onclick=()=>{ closeModal(); tab='plan'; render(); };
    el('wZuEreignis').onclick=wizEreignis;
    return;
  }
  openModal(mHead('Abweichung von einer Maßnahme','Schritt 2 von 2')+`
  <div class="field"><label class="fl" for="wM">Welche Maßnahme?</label>
    <select class="inp" id="wM">${aktive.map(m=>'<option value="'+m.id+'">'+esc(m.titel)+'</option>').join('')}</select></div>
  <div class="field"><label class="fl">Was war los?</label>
    <div class="seg small" id="wArt">${Object.entries(ABW_ART).map(([k,v],i)=>'<button data-art="'+k+'" aria-pressed="'+(i===0)+'">'+v+'</button>').join('')}</div></div>
  <div class="field"><label class="fl" for="wText">Beschreibung – und wie hast Du reagiert?</label>
    <textarea id="wText" placeholder="z. B.: Lehnt die Begleitung zum Mittagstisch ab, möchte im Zimmer essen. Tablett gebracht, Trinkmenge beobachtet."></textarea>
    <div class="hint"><b>Sachlich bleiben:</b> Beobachtung statt Etikett – beschreib, was Du gesehen und getan hast.</div></div>
  ${hzInput()}
  ${warum('sachlich')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  let art = 'nicht';
  el('wArt').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    art = btn.dataset.art;
    el('wArt').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    if(!text){ toast('Ohne Beschreibung kein Eintrag.'); return; }
    const th = readTsHz(); if(!th) return;
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'abweichung', mId:el('wM').value, art, text});
    persist(); closeModal(); tab='bericht'; render(); toast('Abweichung dokumentiert.');
  };
}

function wizEreignis(){
  const b = aktiv();
  openModal(mHead('Ereignis oder Beobachtung','Mit Reaktionskette – sie ist es, die zählt.')+`
  <div class="field"><label class="fl">Kategorie</label>
    <div class="seg small" id="wKat">${EREIGNIS_KAT.map((k,i)=>'<button data-kat="'+esc(k)+'" aria-pressed="'+(i===0)+'">'+esc(k)+'</button>').join('')}</div></div>
  <div class="field"><label class="fl" for="wText">Was hast Du beobachtet?</label>
    <textarea id="wText" placeholder="Sachlich und konkret: was, wo, seit wann, wie ausgeprägt?"></textarea>
    <div class="hint"><b>Sachlich bleiben:</b> „schiebt den Teller weg, isst 2 Löffel“ statt „unkooperativ“.</div></div>
  <div class="field"><label class="fl" for="wSofort">Sofortmaßnahme / erste Reaktion</label>
    <textarea id="wSofort" placeholder="Was hast Du unmittelbar getan?"></textarea></div>
  <div class="field"><label class="fl">Wer wurde informiert?</label>
    <div class="row" id="wInf">
      ${['Arzt/Ärztin','Angehörige / Betreuung','PDL / WBL','Niemand erforderlich'].map(x=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+esc(x)+'"> '+esc(x)+'</label>').join('')}
    </div></div>
  <div class="field"><label class="fl" for="wVerlauf">Was beobachtest Du weiter? (optional)</label>
    <input type="text" id="wVerlauf" placeholder="z. B. 24-h-Sturzbeobachtung, Schmerz, Vigilanz, Trinkmenge"></div>
  <div class="field"><label class="fl">Hat das Folgen für SIS oder Maßnahmenplan?</label>
    <div class="seg small" id="wFolgen"><button data-f="nein" aria-pressed="true">Nein</button><button data-f="ja" aria-pressed="false">Ja – Anpassung nötig</button></div>
    <div class="hint">Bei „Ja“ merkt sich das Werkzeug die offene Rückkopplung, bis SIS/Plan angepasst sind.</div></div>
  ${hzInput()}
  ${warum('reaktion')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  let kat = EREIGNIS_KAT[0], folgen = false;
  el('wKat').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    kat = btn.dataset.kat; el('wKat').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wFolgen').querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
    folgen = btn.dataset.f==='ja'; el('wFolgen').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
  });
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    const sofort = el('wSofort').value.trim();
    if(!text){ toast('Ohne Beobachtung kein Eintrag.'); return; }
    if(!sofort){ toast('Ein Ereignis ohne dokumentierte Reaktion ist der gefährlichste Eintrag – bitte Sofortmaßnahme ergänzen.'); return; }
    const th = readTsHz(); if(!th) return;
    const informiert = Array.from(el('wInf').querySelectorAll('input:checked')).map(x=>x.value);
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'ereignis', kat, text,
      reaktion:{sofort, informiert, verlauf: el('wVerlauf').value.trim(), folgen}, erledigt:false});
    persist(); closeModal(); tab='bericht'; render();
    toast(folgen? 'Ereignis dokumentiert – Rückkopplung in SIS/Plan ist als offen vermerkt.' : 'Ereignis mit Reaktionskette dokumentiert.');
  };
}

function wizPositiv(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  openModal(mHead('Positive Entwicklung','Auch Verbesserungen sind Abweichungen – die schönsten.')+`
  <div class="field"><label class="fl" for="wText">Was hat sich verbessert?</label>
    <textarea id="wText" placeholder="z. B.: Geht die Strecke zum Speisesaal seit drei Tagen ohne Pause, wirkt sicherer."></textarea></div>
  ${aktive.length?`<div class="field"><label class="fl" for="wM">Bezug zu einer Maßnahme (optional)</label>
    <select class="inp" id="wM"><option value="">– kein Bezug –</option>${aktive.map(m=>'<option value="'+m.id+'">'+esc(m.titel)+'</option>').join('')}</select>
    <div class="hint">Wenn eine Maßnahme wirkt oder Unterstützung reduziert werden kann: guter Anlass für eine Evaluation.</div></div>`:''}
  ${hzInput()}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="wSave">Eintrag speichern</button><button class="btn ghost" id="wBack">Zurück</button></div>`);
  el('wBack').onclick = wizBericht;
  el('wSave').onclick = ()=>{
    const text = el('wText').value.trim();
    if(!text){ toast('Ohne Beschreibung kein Eintrag.'); return; }
    const th = readTsHz(); if(!th) return;
    const mId = el('wM') ? el('wM').value || null : null;
    b.berichte.push({id:uid(), ts:th.ts, rec:Date.now(), hz:th.hz, typ:'positiv', mId, text});
    persist(); closeModal(); tab='bericht'; render(); toast('Positive Entwicklung dokumentiert.');
  };
}

/* --- Maßnahmen-Editor --- */
function wizMassnahme(mid){
  const b = aktiv();
  const m = mid ? b.massnahmen.find(x=>x.id===mid) : null;
  const risiken = RISK.filter(r=> b.sis.risiken[r.k].risiko==='ja' || b.sis.risiken[r.k].we==='ja' || (m && m.bezug.risiken.includes(r.k)));
  openModal(mHead(m?'Maßnahme bearbeiten':'Neue Maßnahme','Konkret genug für Vertretung und Einarbeitung: Was, wie, wann, durch wen.')+`
  <div class="field"><label class="fl" for="mTitel">Maßnahme (Was?)</label>
    <input type="text" id="mTitel" value="${esc(m?m.titel:'')}" placeholder="z. B. Begleitung zum Mittagstisch"></div>
  <div class="field"><label class="fl" for="mWie">Wie genau? Hilfsmittel, Besonderheiten</label>
    <textarea id="mWie" placeholder="z. B.: Transfer mit Rollator und Begleitung einer Person, Abstützen rechts wegen Hemiparese links.">${esc(m?m.wie:'')}</textarea>
    <div class="hint">„Mobilisation nach Bedarf“ ist nicht handlungsleitend – Details gehören hierher, nicht in den Kopf des Wohnbereichs.</div>
    ${window.KOMPENDIUM ? '<div class="row" style="margin-top:8px"><button type="button" class="btn small" id="fhToggle" aria-expanded="false">Formulierungshilfe</button><span class="faint">Musterformulierungen aus dem Maßnahmenkompendium</span></div><div class="fh" id="fhBox" hidden></div>' : ''}</div>
  <div class="field"><label class="fl" for="mEigen">Was übernimmt die Person selbst?</label>
    <input type="text" id="mEigen" value="${esc(m?m.eigen:'')}" placeholder="z. B. wäscht Gesicht und Oberkörper selbständig"></div>
  <div class="field"><label class="fl">Wann? (Tagesstruktur)</label>
    <div class="row" id="mZeiten">${ZEITEN.map(z=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+z.k+'"'+(m&&m.zeiten.includes(z.k)?' checked':'')+'> '+z.name+'</label>').join('')}</div></div>
  <div class="field"><label class="fl">Begründung: Worauf bezieht sich die Maßnahme?</label>
    ${risiken.length?'<div style="margin-bottom:6px"><span class="faint">Risiken aus der Matrix:</span><div class="row" id="mBezR">'+risiken.map(r=>{
      const ri=b.sis.risiken[r.k]; const nm = r.k==='sonstiges'&&ri.label?ri.label:r.name;
      return '<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+r.k+'"'+(m&&m.bezug.risiken.includes(r.k)?' checked':'')+'> '+esc(nm)+'</label>';
    }).join('')+'</div></div>':''}
    <div><span class="faint">Themenfelder der SIS:</span><div class="row" id="mBezF">${TF.map(f=>'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" value="'+f.k+'"'+(m&&m.bezug.felder.includes(f.k)?' checked':'')+'> '+f.name+'</label>').join('')}</div></div>
    <div class="hint">Keine Maßnahme ohne erhobene Grundlage – der rote Faden von der SIS in den Plan.</div></div>
  ${warum('ableitung')}
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="mSave">${m?'Speichern':'Anlegen'}</button>
    ${m && m.status==='aktiv' ? '<button class="btn ghost danger" id="mEnd">Maßnahme beenden</button>':''}
    ${m && m.status!=='aktiv' ? '<button class="btn ghost" id="mReakt">Reaktivieren</button>':''}
  </div>`);
  el('mSave').onclick = ()=>{
    const titel = el('mTitel').value.trim();
    if(!titel){ toast('Die Maßnahme braucht einen Namen.'); return; }
    const zeiten = Array.from(el('mZeiten').querySelectorAll('input:checked')).map(x=>x.value);
    if(!zeiten.length){ toast('Wann? Ohne Tagesstruktur ist der Plan kein Arbeitsinstrument.'); return; }
    const bezR = el('mBezR') ? Array.from(el('mBezR').querySelectorAll('input:checked')).map(x=>x.value) : [];
    const bezF = Array.from(el('mBezF').querySelectorAll('input:checked')).map(x=>x.value);
    if(m){
      Object.assign(m, {titel, wie:el('mWie').value.trim(), eigen:el('mEigen').value.trim(), zeiten, bezug:{risiken:bezR, felder:bezF}, updated:Date.now()});
    } else {
      b.massnahmen.push({id:uid(), titel, wie:el('mWie').value.trim(), eigen:el('mEigen').value.trim(), zeiten,
        bezug:{risiken:bezR, felder:bezF}, status:'aktiv', created:Date.now(), updated:Date.now()});
    }
    persist(); closeModal(); render();
    const neu = m || b.massnahmen[b.massnahmen.length-1];
    if(hatPlatzhalter(neu)) toast('Gespeichert – Beispielangaben in eckigen Klammern bitte noch für diese Person festlegen.');
    else toast(m?'Maßnahme aktualisiert.':'Maßnahme angelegt.');
  };
  const fhT = el('fhToggle'); if(fhT) fhT.onclick = ()=>{ const box = el('fhBox'); const open = box.hidden; box.hidden = !open; fhT.setAttribute('aria-expanded', String(open)); if(open){ fhReset(); fhRender(b); } };
  const end = el('mEnd'); if(end) end.onclick = ()=>{ m.status='beendet'; m.updated=Date.now(); persist(); closeModal(); render(); toast('Maßnahme beendet.'); };
  const rea = el('mReakt'); if(rea) rea.onclick = ()=>{ m.status='aktiv'; m.updated=Date.now(); persist(); closeModal(); render(); };
}

/* --- Formulierungshilfe aus dem Maßnahmenkompendium --- */
const PH_RE = /\[[^\]\n]{1,80}\]/;
function hatPlatzhalter(m){ return PH_RE.test(m.titel||'') || PH_RE.test(m.wie||'') || PH_RE.test(m.eigen||''); }
function phHtml(t){ return esc(t).replace(/⟦/g,'<mark class="ph">').replace(/⟧/g,'</mark>'); }
function phPlain(t){ return t.replace(/⟦/g,'[').replace(/⟧/g,']'); }
let fh = {kap:null, el:null, q:''};
function fhReset(){ fh = {kap:null, el:null, q:''}; }
function fhKapitel(){ return (window.KOMPENDIUM && KOMPENDIUM.kapitel || []).filter(c=>c.art==='plan'); }
/* Passende Kapitel: aus dem gerade angehakten Bezug im Editor und den bejahten Risiken der SIS */
function fhPassend(b){
  const chk = id => el(id) ? Array.from(el(id).querySelectorAll('input:checked')).map(x=>x.value) : [];
  const risk = new Set(chk('mBezR').concat(RISK.filter(r=>b.sis.risiken[r.k].risiko==='ja').map(r=>r.k)));
  const feld = new Set(chk('mBezF'));
  return new Set(fhKapitel().filter(c=> c.risiken.some(k=>risk.has(k)) || c.felder.some(k=>feld.has(k))).map(c=>c.k));
}
function fhRender(b){
  const box = el('fhBox'); if(!box) return;
  const kap = fhKapitel();
  let html = '<input type="text" id="fhQ" placeholder="Suchen, z. B. Positionswechsel, Trinkmenge, Rollator …" value="'+esc(fh.q)+'" autocomplete="off">';
  html += '<div class="fh-scroll">';
  const q = fh.q.trim().toLowerCase();
  if(q.length>=3){
    const tok = q.split(/\s+/);
    const hits = [];
    kap.forEach(c=>c.elemente.forEach(e=>e.saetze.forEach((sz,i)=>{
      const hay = (sz.t+' '+e.name+' '+c.kurz).toLowerCase();
      if(tok.every(t=>hay.includes(t))) hits.push({c,e,i,sz});
    })));
    html += '<div class="fh-sec">'+(hits.length? Math.min(hits.length,60)+(hits.length>60?' von '+hits.length:'')+' Treffer':'Keine Treffer')+'</div>';
    html += hits.slice(0,60).map(h=>'<button type="button" class="fh-s" data-fhs="'+h.c.k+'|'+h.e.k+'|'+h.i+'">'+phHtml(h.sz.t)+'<span class="src">'+esc(h.c.kurz)+' › '+esc(h.e.nr+' '+h.e.name)+'</span></button>').join('');
  } else {
    const pass = fhPassend(b);
    const sorted = kap.slice().sort((a,c)=> (pass.has(c.k)-pass.has(a.k)) || (a.nr-c.nr));
    html += '<div class="fh-sec">'+(pass.size?'Themen – passend zum Bezug zuerst':'Themen')+'</div><div class="row">'+
      sorted.map(c=>'<button type="button" class="fh-chip'+(pass.has(c.k)?' pass':'')+'" data-fhk="'+c.k+'" aria-pressed="'+(fh.kap===c.k)+'">'+esc(c.kurz)+'</button>').join('')+'</div>';
    const c = kap.find(x=>x.k===fh.kap);
    if(c){
      html += '<div class="fh-sec">'+esc(c.name)+'</div>';
      const e = c.elemente.find(x=>x.k===fh.el);
      if(!e){
        html += c.elemente.map(x=>'<button type="button" class="fh-el" data-fhe="'+x.k+'"><span class="no">'+esc(x.nr)+'</span>'+esc(x.name)+' <span class="faint">· '+x.saetze.length+'</span></button>').join('');
      } else {
        html += '<button type="button" class="btn small ghost" data-fhe="" style="margin-bottom:6px">← Alle Elemente</button>';
        html += '<div class="fh-g" style="margin-top:0"><span class="no" style="color:var(--gold-dark);font-size:12px;font-weight:600">'+esc(e.nr)+'</span> '+esc(e.name)+'</div>';
        if(e.intro) html += '<p class="fh-intro">'+esc(e.intro)+'</p>';
        let g = null;
        e.saetze.forEach((sz,i)=>{
          if(sz.g && sz.g!==g){ g = sz.g; html += '<div class="fh-g">'+esc(g)+'</div>'; }
          html += '<button type="button" class="fh-s" data-fhs="'+c.k+'|'+e.k+'|'+i+'">'+phHtml(sz.t)+'</button>';
        });
        if(e.hinweise && e.hinweise.length) html += '<details class="warum"><summary>Hinweise zur Dokumentation</summary><div class="wb"><ul style="margin:6px 0 0;padding-left:18px">'+e.hinweise.map(h=>'<li>'+esc(h)+'</li>').join('')+'</ul></div></details>';
      }
    } else {
      html += '<div class="hint" style="margin-top:8px">Thema wählen oder suchen. Klick auf eine Formulierung übernimmt sie in „Wie genau?“ – Platzhalter <mark class="ph">so</mark> markiert, im Text dann in eckigen Klammern.</div>';
    }
  }
  html += '</div>'+warum('formulierung')+'<div class="fh-foot">Quelle: '+esc(KOMPENDIUM.quelle)+'. Beispiele, keine Standards – Intervalle, Hilfsmittel und Skalenwerte individuell festlegen.</div>';
  box.innerHTML = html;
  const qi = el('fhQ');
  qi.oninput = ()=>{ fh.q = qi.value; const pos = qi.selectionStart; fhRender(b); const n = el('fhQ'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} };
  box.querySelectorAll('[data-fhk]').forEach(x=>x.onclick=()=>{ fh.kap = (fh.kap===x.dataset.fhk? null : x.dataset.fhk); fh.el=null; fhRender(b); });
  box.querySelectorAll('[data-fhe]').forEach(x=>x.onclick=()=>{ fh.el = x.dataset.fhe || null; fhRender(b); box.querySelector('.fh-scroll').scrollTop = 0; });
  box.querySelectorAll('[data-fhs]').forEach(x=>x.onclick=()=>{ const [ck,ek,i] = x.dataset.fhs.split('|'); fhInsert(b, ck, ek, +i); });
}
function fhInsert(b, ck, ek, i){
  const c = fhKapitel().find(x=>x.k===ck); const e = c && c.elemente.find(x=>x.k===ek); const sz = e && e.saetze[i]; if(!sz) return;
  const ta = el('mWie'); const txt = phPlain(sz.t);
  ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/,'') + '\n' : '') + txt;
  const ti = el('mTitel'); let info = [];
  if(!ti.value.trim()){ ti.value = e.name; info.push('Titel vorgeschlagen'); }
  /* Bezug ergänzen: Risiko aus der Matrix (nur wenn dort bejaht/offen) und Themenfelder des Kapitels */
  const bez = [];
  c.risiken.forEach(k=>{ const cb = el('mBezR') && el('mBezR').querySelector('input[value="'+k+'"]'); if(cb && !cb.checked){ cb.checked = true; bez.push(RISK.find(r=>r.k===k).name); } });
  c.felder.forEach(k=>{ const cb = el('mBezF').querySelector('input[value="'+k+'"]'); if(cb && !cb.checked){ cb.checked = true; bez.push(TF.find(f=>f.k===k).name.split(' &')[0]); } });
  if(bez.length) info.push('Bezug ergänzt: '+bez.join(', '));
  toast('Übernommen'+(txt.includes('[')?' – Platzhalter in [ ] für diese Person festlegen':'')+(info.length?' · '+info.join(' · '):'')+'.');
  ta.scrollTop = ta.scrollHeight;
}

/* --- Evaluations-Wizard --- */
function wizEval(){
  const b = aktiv();
  const aktive = b.massnahmen.filter(m=>m.status==='aktiv');
  if(!aktive.length) return;
  const letzteEval = b.evaluationen.length ? Math.max(...b.evaluationen.map(rec)) : null;
  const abw = m => b.berichte.filter(e=>e.mId===m.id && e.typ==='abweichung' && (!letzteEval || rec(e)>letzteEval)).length;
  openModal(mHead('Evaluation','Wirkt, was wir tun – und was folgt daraus?')+`
  <div class="field"><label class="fl" for="evAnlass">Anlass</label>
    <select class="inp" id="evAnlass">${Object.entries(EVAL_ANLASS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')}</select></div>
  <div class="field"><label class="fl" for="evNotiz">Beteiligung der Person / Bezugspersonen</label>
    <input type="text" id="evNotiz" placeholder="z. B.: Gespräch mit Frau M.; Tochter telefonisch einbezogen">
    <div class="hint">Evaluation ist kein Verwaltungsakt über die Person hinweg – ihre Einschätzung gehört in die Bewertung (soweit möglich).</div></div>
  <div id="evItems">
  ${aktive.map(m=>`
    <div class="card tight" data-ev="${m.id}">
      <div class="spread"><h3>${esc(m.titel)}</h3>${abw(m)?'<span class="pill gold num">'+abw(m)+' Abweichungen seit letzter Eval</span>':'<span class="pill">keine Abweichungen</span>'}</div>
      <div class="field" style="margin-top:8px"><label class="fl">Wirksam?</label>
        <div class="seg small" data-role="wirksam"><button data-v="ja">Ja</button><button data-v="teilweise">Teilweise</button><button data-v="nein">Nein</button></div></div>
      <div class="field"><label class="fl">Woran erkennbar?</label>
        <input type="text" data-role="woran" placeholder="z. B. keine neuen Stürze, Gewicht stabil, kommt wieder zum Mittagstisch"></div>
      <div class="field" style="margin-bottom:6px"><label class="fl">Konsequenz</label>
        <div class="seg small" data-role="konsequenz"><button data-v="beibehalten">Beibehalten</button><button data-v="anpassen">Anpassen</button><button data-v="beenden">Beenden</button></div></div>
      <div class="field" style="margin-bottom:4px"><label class="fl">Begründung</label>
        <input type="text" data-role="begr" placeholder="Auch „keine Änderung erforderlich“ braucht eine erkennbare Entscheidung"></div>
    </div>`).join('')}
  </div>
  ${hzInput()}
  ${warum('evalWirkung')}${warum('evalKonsequenz')}
  <div class="row" style="margin-top:12px"><button class="btn primary" id="evSave">Evaluation abschließen</button></div>`);
  el('modalBox').querySelectorAll('.seg[data-role]').forEach(seg=>{
    seg.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{
      seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===btn));
    });
  });
  el('evSave').onclick = ()=>{
    const th = readTsHz(); if(!th) return;
    const items = [];
    let fehlt = false;
    el('modalBox').querySelectorAll('[data-ev]').forEach(card=>{
      const wBtn = card.querySelector('.seg[data-role=wirksam] button[aria-pressed="true"]');
      const kBtn = card.querySelector('.seg[data-role=konsequenz] button[aria-pressed="true"]');
      const woran = card.querySelector('[data-role=woran]').value.trim();
      const begr = card.querySelector('[data-role=begr]').value.trim();
      if(!wBtn || !kBtn){ fehlt = true; return; }
      if(wBtn.dataset.v!=='ja' && !begr && kBtn.dataset.v==='beibehalten'){ fehlt='begr'; card.style.borderColor='var(--crit)'; return; }
      items.push({mId:card.dataset.ev, wirksam:wBtn.dataset.v, woran, konsequenz:kBtn.dataset.v, begr});
    });
    if(fehlt==='begr'){ toast('„Nicht wirksam, trotzdem beibehalten“ braucht eine Begründung – sonst ist es ein Abhak-Ritual.'); return; }
    if(fehlt){ toast('Bitte für jede Maßnahme Wirksamkeit und Konsequenz bewerten.'); return; }
    const ev = {id:uid(), ts:th.ts, rec:Date.now(), pfk:th.hz, anlass:el('evAnlass').value, notiz:el('evNotiz').value.trim(), items};
    b.evaluationen.push(ev);
    items.filter(i=>i.konsequenz==='beenden').forEach(i=>{
      const m = b.massnahmen.find(x=>x.id===i.mId); if(m){ m.status='beendet'; m.updated=Date.now(); }
    });
    persist(); closeModal(); tab='eval'; render();
    const anz = items.filter(i=>i.konsequenz==='anpassen').length;
    toast(anz? 'Evaluation gespeichert – '+anz+' Maßnahme(n) warten auf Anpassung im Plan.' : 'Evaluation gespeichert – Regelkreis geschlossen.');
  };
}

/* ================= Event-Bindings ================= */
function bindPanel(b){
  const p = el('panel');
  p.querySelectorAll('[data-goto]').forEach(btn=>btn.onclick=()=>{ tab=btn.dataset.goto; render(); window.scrollTo({top:0}); });
  p.querySelectorAll('[data-switch]').forEach(btn=>btn.onclick=()=>{ store.activeId=btn.dataset.switch; persist(); render(); window.scrollTo({top:0}); });
  const bn = p.querySelector('[data-goto-bericht-neu]'); if(bn) bn.onclick = wizBericht;
  /* SIS */
  const bindTxt = (id, fn) => { const n = el(id); if(n) n.oninput = e=>{ fn(e.target.value); save(); }; };
  bindTxt('sisDatum', v=>b.sis.datum=v);
  bindTxt('sisPfk', v=>b.sis.pfk=v);
  bindTxt('sisEingang', v=>b.sis.eingang.text=v);
  bindTxt('sisFremd', v=>b.sis.eingang.fremdWer=v);
  bindTf(b);
  p.querySelectorAll('[data-risktext]').forEach(t=>t.oninput = e=>{ b.sis.risiken[t.dataset.risktext].text=e.target.value; save(); });
  p.querySelectorAll('[data-risklabel]').forEach(t=>t.oninput = e=>{ b.sis.risiken[t.dataset.risklabel].label=e.target.value; save(); });
  p.querySelectorAll('[data-risktf]').forEach(btn=>btn.onclick=()=>{
    const [k,n] = btn.dataset.risktf.split('|'); const ri = b.sis.risiken[k]; const num = parseInt(n,10);
    ri.felder = ri.felder.includes(num) ? ri.felder.filter(x=>x!==num) : ri.felder.concat(num).sort();
    persist(); render();
  });
  p.querySelectorAll('[data-seg]').forEach(btn=>btn.onclick=()=>{
    const g = btn.dataset.seg, v = btn.dataset.val;
    if(g==='anlass') b.sis.anlass = (b.sis.anlass===v?'':v);
    else if(g==='quelle') b.sis.eingang.quelle = v;
    else if(g.startsWith('riskja:')){ const k=g.slice(7); const ri=b.sis.risiken[k]; ri.risiko = (ri.risiko===v?'':v); }
    else if(g.startsWith('riskwe:')){ const k=g.slice(7); const ri=b.sis.risiken[k]; ri.we = (ri.we===v?'':v); }
    persist(); render();
  });
  /* Plan */
  const mn = el('btnMNeu'); if(mn) mn.onclick = ()=>wizMassnahme(null);
  p.querySelectorAll('[data-medit]').forEach(btn=>btn.onclick=()=>wizMassnahme(btn.dataset.medit));
  /* Bericht */
  const bneu = el('btnBNeu'); if(bneu) bneu.onclick = wizBericht;
  p.querySelectorAll('[data-erledigt]').forEach(btn=>btn.onclick=()=>{
    const e = b.berichte.find(x=>x.id===btn.dataset.erledigt);
    if(e){ e.erledigt = true; persist(); render(); toast('Rückkopplung als erledigt markiert.'); }
  });
  /* Eval */
  const ev = el('btnEvNeu'); if(ev) ev.onclick = wizEval;
}

/* Kopf-Leiste */
el('bwSelect').onchange = e=>{ store.activeId = e.target.value; persist(); tab='start'; render(); };
el('btnBwNeu').onclick = ()=>{
  openModal(mHead('Neue Bewohner:in','Name oder Kürzel – bitte datensparsam.')+
    '<div class="field"><label class="fl">Anrede</label>'+anredeSeg('nbAnrede','')+'<div class="hint">Steuert „er/sie“ im erzeugten SIS-Text. Ohne Anrede wird der Name wiederholt.</div></div>'+
    '<div class="field"><label class="fl" for="nbName">Name</label><input type="text" id="nbName" placeholder="z. B. M. (Zi. 12)"></div>'+
    '<button class="btn primary" id="nbSave">Anlegen</button>');
  const nbAnrede = bindSeg('nbAnrede');
  el('nbName').focus();
  el('nbSave').onclick = ()=>{
    const n = el('nbName').value.trim(); if(!n){ toast('Name fehlt.'); return; }
    neuBewohner(n, nbAnrede()); closeModal(); tab='sis'; render();
    toast('Angelegt – Einstieg ist die SIS: die Person kommt zuerst zu Wort.');
  };
  el('nbName').onkeydown = e=>{ if(e.key==='Enter') el('nbSave').click(); };
};
el('btnBwUmben').onclick = ()=>{
  const b = aktiv(); if(!b) return;
  openModal(mHead('Umbenennen','')+
    '<div class="field"><label class="fl">Anrede</label>'+anredeSeg('rnAnrede',b.anrede)+'</div>'+
    '<div class="field"><label class="fl" for="rnName">Name</label><input type="text" id="rnName" value="'+esc(b.name)+'"></div>'+
    '<button class="btn primary" id="rnSave">Speichern</button>');
  const rnAnrede = bindSeg('rnAnrede');
  el('rnSave').onclick = ()=>{ const n=el('rnName').value.trim(); if(n){ b.name=n; b.anrede=rnAnrede(); persist(); closeModal(); render(); } };
};
el('btnBwDel').onclick = ()=>{
  const b = aktiv(); if(!b) return;
  openModal(mHead('Wirklich löschen?','')+
    '<p>„'+esc(anzeigeName(b))+'“ mit SIS, Plan, '+b.berichte.length+' Berichten und '+b.evaluationen.length+' Evaluationen unwiderruflich löschen?</p>'+
    '<div class="row"><button class="btn danger" id="delYes">Ja, löschen</button><button class="btn ghost" onclick="closeModal()">Abbrechen</button></div>');
  el('delYes').onclick = ()=>{
    store.bewohner = store.bewohner.filter(x=>x.id!==b.id);
    store.activeId = store.bewohner.length? store.bewohner[0].id : null;
    persist(); closeModal(); render(); toast('Gelöscht.');
  };
};
el('btnExport').onclick = ()=>{
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sis-assist-prozess-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
el('btnImport').onclick = ()=> el('fileImport').click();
el('fileImport').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if(!s || !Array.isArray(s.bewohner)) throw 0;
      store = migrate(s); if(!store.activeId && store.bewohner.length) store.activeId = store.bewohner[0].id;
      persist(); render(); toast('Import erfolgreich: '+store.bewohner.length+' Bewohner:in(nen).');
    }catch(err){ toast('Import fehlgeschlagen – keine gültige Exportdatei.'); }
  };
  r.readAsText(f); e.target.value='';
};

/* Init */
if(!store.activeId && store.bewohner.length) store.activeId = store.bewohner[0].id;
render();
</script>
